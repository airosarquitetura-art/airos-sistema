  function bind(){
    var rec=ov.querySelector('#fi-rec');
    rec.onchange=function(){
      ov.querySelector('#fi-date-wrap').style.display=rec.value==='yes'?'none':'block';
      ov.querySelector('#fi-day-wrap').style.display=rec.value==='yes'?'block':'none';
    };
    // categoria select: preenche descricao e valor se Reserva de caixa
    var cat=ov.querySelector('#fi-cat');
    if(cat) cat.onchange=function(){
      // save current values before redraw
      var curDesc=ov.querySelector('#fi-desc')?ov.querySelector('#fi-desc').value:'';
      var curVal=ov.querySelector('#fi-value')?ov.querySelector('#fi-value').value:'';
      var selCat=cat.value;
      // update it.desc so draw() picks it up
      if(selCat && selCat!=='Outro') it.desc=selCat;
      if(selCat==='Reserva de caixa' && reserveBal>0) it.value=reserveBal;
      draw();
      // after redraw, ensure desc field reflects selection
      var descEl=ov.querySelector('#fi-desc');
      if(descEl && selCat && selCat!=='Outro') descEl.value=selCat;
      // ensure category select shows correct value
      var catEl=ov.querySelector('#fi-cat');
      if(catEl) catEl.value=selCat;
    };
    ov.querySelector('#fi-cancel').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    var del=ov.querySelector('#fi-del');
    if(del) del.onclick=function(){
      if(confirm('Excluir lancamento?')){
        if(isInc) db.finance.incomes=db.finance.incomes.filter(function(x){ return x.id!==it.id; });
        else db.finance.expenses=db.finance.expenses.filter(function(x){ return x.id!==it.id; });
        save(); ov.remove(); render();
      }
    };
    ov.querySelector('#fi-save').onclick=function(){
      var err=ov.querySelector('#fi-err'), val=parseMoney(ov.querySelector('#fi-value').value);
      if(val<=0){ err.textContent='Informe o valor.'; err.style.display='block'; return; }
      if(isInc){ it.type=ov.querySelector('#fi-type').value; it.client=ov.querySelector('#fi-client').value.trim(); }
      else {
        var catV=ov.querySelector('#fi-cat')?ov.querySelector('#fi-cat').value:'';
        it.desc=(ov.querySelector('#fi-desc').value.trim()||catV);
        if(!it.desc){ err.textContent='Informe a descricao.'; err.style.display='block'; return; }
        it.category=catV;
        // if Reserva de caixa: also register as retirada da reserva
        if(catV==='Reserva de caixa'&&isNew){
          db.finance.reserve.movements.push({id:uid(),type:'retirada',value:val,date:ov.querySelector('#fi-date')?.value||today(),note:'Saida registrada no financeiro'});
        }
      }
      it.value=val; it.recurring=rec.value==='yes';
      if(it.recurring){ it.day=Math.max(1,Math.min(31,parseInt(ov.querySelector('#fi-day').value,10)||5)); if(!it.startMonth) it.startMonth=state.finMonth; }
      else it.date=ov.querySelector('#fi-date').value||today();
      if(isNew) arr.push(it); save(); ov.remove(); render();
    };
  }

  document.getElementById('app-root').appendChild(ov);
  draw();
}

function pageDashboard(){
  var u=me(); if(!u) return;
  var hoje=today();
  var now=new Date();
  var mes=hoje.slice(0,7);

  // ── FINANCEIRO ────────────────────────────────────────────────────────────
  var incomes=db.finance&&db.finance.incomes?db.finance.incomes:[];
  var expenses=db.finance&&db.finance.expenses?db.finance.expenses:[];
  var contracts=db.finance&&db.finance.contracts?db.finance.contracts:[];

  var recebidoMes=incomes.filter(function(i){ return i.date&&i.date.slice(0,7)===mes&&i.paid; }).reduce(function(s,i){ return s+(+i.amount||0); },0);
  var aReceberMes=incomes.filter(function(i){ return i.date&&i.date.slice(0,7)===mes&&!i.paid; }).reduce(function(s,i){ return s+(+i.amount||0); },0);
  var totalDespesas=expenses.filter(function(e){ return e.date&&e.date.slice(0,7)===mes; }).reduce(function(s,e){ return s+(+e.amount||0); },0);
  var saldoMes=recebidoMes-totalDespesas;
  var inadimplencia=incomes.filter(function(i){ return !i.paid&&i.date&&i.date<hoje; }).reduce(function(s,i){ return s+(+i.amount||0); },0);

  // Receita últimos 6 meses para gráfico
  var mesesLabels=[]; var mesesVals=[];
  for(var mi=5;mi>=0;mi--){
    var d=new Date(now.getFullYear(),now.getMonth()-mi,1);
    var mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var MESES_S=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    mesesLabels.push(MESES_S[d.getMonth()]);
    mesesVals.push(incomes.filter(function(i){ return i.date&&i.date.slice(0,7)===mk&&i.paid; }).reduce(function(s,i){ return s+(+i.amount||0); },0));
  }
  var maxVal=Math.max.apply(null,mesesVals)||1;

  // ── LEADS / FUNIL ────────────────────────────────────────────────────────
  var leads=db.leads||[];
  var leadsAberto=leads.filter(function(l){ return OPEN_STATUS.indexOf(l.status)>=0; }).length;
  var leadsFechados=leads.filter(function(l){ return l.status==='fechado'&&l.createdAt&&new Date(l.createdAt).toISOString().slice(0,7)===mes; }).length;
  var leadsTotal=leads.length;
  var txConversao=leadsTotal?Math.round(leads.filter(function(l){ return l.status==='fechado'; }).length/leadsTotal*100):0;

  // Funil counts
  var funilSteps=[
    {label:'Novo lead',key:'novo',color:'#3F6273'},
    {label:'Negociacao',key:'negociacao',color:'#7a3818'},
    {label:'Reuniao',key:'reuniao',color:'#9A5B2E'},
    {label:'Proposta',key:'proposta',color:'#C5CBCB'},
    {label:'Fechado',key:'fechado',color:'#27AE60'}
  ];
  var funilMax=Math.max.apply(null,funilSteps.map(function(s){ return leads.filter(function(l){ return l.status===s.key; }).length; }))||1;

  // ── PROJETOS ─────────────────────────────────────────────────────────────
  var projetos=db.crmProjects||[];
  var projetosAtivos=projetos.filter(function(p){ return p.status!=='concluido'; });
  var etapasAtrasadas=[];
  projetosAtivos.forEach(function(p){
    (p.stages||[]).forEach(function(s){
      if(s.end&&s.end<hoje&&s.status!=='concluido') etapasAtrasadas.push({proj:p.client,etapa:s.name,end:s.end});
    });
  });

  // Distribuição por tipo
  var tipoCount={arquitetura:0,interiores:0,arq_int:0,consultoria:0};
  projetos.forEach(function(p){ if(tipoCount[p.type]!==undefined) tipoCount[p.type]++; });
  var tipoTotal=projetos.length||1;

  // ── EQUIPE / TAREFAS ─────────────────────────────────────────────────────
  var users=db.users||[];
  var tasksByUser={};
  users.forEach(function(u2){ tasksByUser[u2.id]={name:u2.name,open:0,doing:0,done:0}; });
  (db.projects||[]).forEach(function(p){
    (p.tasks||[]).forEach(function(t){
      if(t.assigneeId&&tasksByUser[t.assigneeId]){
        if(t.status==='concluido') tasksByUser[t.assigneeId].done++;
        else if(t.status==='andamento') tasksByUser[t.assigneeId].doing++;
        else tasksByUser[t.assigneeId].open++;
      }
    });
  });

  // ── AGENDA ───────────────────────────────────────────────────────────────
  var reunioes=leads.filter(function(l){ return l.status==='reuniao'&&l.reuniaoDate&&l.reuniaoDate>=hoje; })
    .sort(function(a,b){ return (a.reuniaoDate+' '+(a.reuniaoTime||'')).localeCompare(b.reuniaoDate+' '+(b.reuniaoTime||'')); })
    .slice(0,5);

  // ── ATAS PENDENTES ───────────────────────────────────────────────────────
  var atasPendentes=[];
  projetos.forEach(function(p){
    (p.atas||[]).forEach(function(a){
      if(a.ataStatus==='pendente') atasPendentes.push({client:p.client,ver:a.ver,date:a.date,id:a.id,projId:p.id});
    });
  });

  // ── CONTRATOS A VENCER ───────────────────────────────────────────────────
  var d30=new Date(); d30.setDate(d30.getDate()+30);
  var d30str=d30.toISOString().slice(0,10);
  var contratosVencer=contracts.filter(function(c){ return c.endDate&&c.endDate>=hoje&&c.endDate<=d30str; });

  function fmtR(v){ return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
  function fmtBR(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

  // ── RENDER ───────────────────────────────────────────────────────────────
  var greeting=(function(){
    var h=now.getHours();
    if(h<12) return 'Bom dia';
    if(h<18) return 'Boa tarde';
    return 'Boa noite';
  })();

  var MESES_FULL=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var html='<div class="dash-home">'

    // Saudação
    +'<div class="dash-greeting">'
    +'<div><h1 style="font-size:26px;font-weight:700;margin-bottom:4px">'+greeting+', '+esc(u.name.split(' ')[0])+'.</h1>'
    +'<div style="font-size:13px;color:var(--dim)">'+MESES_FULL[now.getMonth()]+' de '+now.getFullYear()+' · tudo monitorado.</div>'
    +'</div></div>'

    // KPIs financeiros
    +'<div class="dash-kpi-grid">'
    +'<div class="dash-kpi"><div class="dash-kpi-val" style="color:var(--verde)">'+fmtR(recebidoMes)+'</div><div class="dash-kpi-label">Recebido no mês</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val" style="color:var(--madeira)">'+fmtR(aReceberMes)+'</div><div class="dash-kpi-label">A receber no mês</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val" style="color:'+(saldoMes>=0?'var(--verde)':'var(--alerta)')+'">'+fmtR(saldoMes)+'</div><div class="dash-kpi-label">Saldo do mês</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val" style="color:'+(inadimplencia>0?'var(--alerta)':'var(--ink)')+'">'+fmtR(inadimplencia)+'</div><div class="dash-kpi-label">Inadimplência</div></div>'
    +'</div>'

    // KPIs operacionais
    +'<div class="dash-kpi-grid">'
    +'<div class="dash-kpi"><div class="dash-kpi-val">'+projetosAtivos.length+'</div><div class="dash-kpi-label">Projetos ativos</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val">'+leadsAberto+'</div><div class="dash-kpi-label">Leads em aberto</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val">'+leadsFechados+'</div><div class="dash-kpi-label">Fechados no mês</div></div>'
    +'<div class="dash-kpi"><div class="dash-kpi-val">'+txConversao+'%</div><div class="dash-kpi-label">Taxa de conversão</div></div>'
    +'</div>'

    // Gráfico de receita + Funil
    +'<div class="dash-2col">'

    // Gráfico de barras - receita mensal
    +'<div class="card" style="padding:20px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:16px;color:var(--ink)">Receita mensal — últimos 6 meses</div>'
    +'<div style="display:flex;align-items:flex-end;gap:8px;height:120px">'
    +mesesVals.map(function(v,i){
      var pct=Math.round(v/maxVal*100);
      var isMes=mesesLabels[i]===(['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][now.getMonth()]);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'
        +'<div style="font-size:9px;color:var(--dim);white-space:nowrap">'+fmtR(v)+'</div>'
        +'<div style="width:100%;background:'+(isMes?'var(--madeira)':'var(--madeira-soft)')+';border-radius:4px 4px 0 0;height:'+Math.max(4,pct)+'%;min-height:4px"></div>'
        +'<div style="font-size:10px;color:'+(isMes?'var(--madeira)':'var(--faint)')+';font-weight:'+(isMes?'700':'400')+'">'+mesesLabels[i]+'</div>'
        +'</div>';
    }).join('')
    +'</div></div>'

    // Funil de leads
    +'<div class="card" style="padding:20px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:16px">Funil de oportunidades</div>'
    +funilSteps.map(function(s){
      var cnt=leads.filter(function(l){ return l.status===s.key; }).length;
      var pct=Math.round(cnt/funilMax*100);
      return '<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:var(--dim)">'+s.label+'</span><span style="font-weight:700">'+cnt+'</span></div>'
        +'<div style="background:var(--surface-2);border-radius:4px;height:8px"><div style="background:'+s.color+';border-radius:4px;height:8px;width:'+Math.max(4,pct)+'%"></div></div>'
        +'</div>';
    }).join('')
    +'</div>'
    +'</div>' // dash-2col

    // Equipe + Projetos
    +'<div class="dash-2col">'

    // Tarefas por pessoa da equipe
    +'<div class="card" style="padding:20px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:14px">Equipe — tarefas</div>'
    +(Object.keys(tasksByUser).length?Object.keys(tasksByUser).map(function(uid){
      var t=tasksByUser[uid];
      var total=t.open+t.doing+t.done;
      return '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)">'
        +'<span class="avatar" style="width:32px;height:32px;font-size:11px;flex-shrink:0">'+initials(t.name)+'</span>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.name)+'</div>'
        +'<div style="font-size:11px;color:var(--dim)">'+t.doing+' em andamento · '+t.open+' abertas · '+t.done+' concluídas</div>'
        +(total?'<div style="margin-top:4px;background:var(--surface-2);border-radius:4px;height:4px"><div style="background:var(--verde);border-radius:4px;height:4px;width:'+Math.round(t.done/total*100)+'%"></div></div>':'')
        +'</div></div>';
    }).join(''):'<div style="color:var(--faint);font-size:13px">Nenhuma tarefa atribuída.</div>')
    +'</div>'

    // Projetos ativos com progresso
    +'<div class="card" style="padding:20px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:14px">Projetos ativos</div>'
    +(projetosAtivos.length?projetosAtivos.slice(0,6).map(function(p){
      var total=p.stages?p.stages.length:0;
      var done=p.stages?p.stages.filter(function(s){ return s.status==='concluido'; }).length:0;
      var pct=total?Math.round(done/total*100):0;
      return '<div style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" class="dash-proj-row" data-id="'+p.id+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
        +'<span style="font-size:13px;font-weight:600">'+esc(p.client)+'</span>'
        +'<span style="font-size:11px;color:var(--dim)">'+pct+'%</span>'
        +'</div>'
        +'<div style="font-size:11px;color:var(--faint);margin-bottom:5px">'+esc(CRM_TIPO_LABEL[p.type]||p.type||'')+'</div>'
        +'<div style="background:var(--surface-2);border-radius:4px;height:4px"><div style="background:var(--madeira);border-radius:4px;height:4px;width:'+pct+'%"></div></div>'
        +'</div>';
    }).join(''):'<div style="color:var(--faint);font-size:13px">Nenhum projeto ativo.</div>')
    +'</div>'
    +'</div>' // dash-2col

    // Alertas + Agenda
    +'<div class="dash-2col">'

    // Alertas
    +'<div class="card" style="padding:20px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:14px">Alertas</div>'
    +(etapasAtrasadas.length?'<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--alerta);margin-bottom:8px">Etapas atrasadas</div>'
      +etapasAtrasadas.slice(0,4).map(function(e){
        return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><span>'+esc(e.proj)+' — '+esc(e.etapa)+'</span><span style="color:var(--alerta);font-size:11px">'+fmtBR(e.end)+'</span></div>';
      }).join('')+'</div>':'')
    +(atasPendentes.length?'<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ambar);margin-bottom:8px">Atas aguardando confirmação</div>'
      +atasPendentes.slice(0,3).map(function(a){
        return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><span>'+esc(a.client)+' — v'+a.ver+'</span><span style="color:var(--ambar);font-size:11px">'+fmtBR(a.date)+'</span></div>';
      }).join('')+'</div>':'')
    +(contratosVencer.length?'<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--madeira);margin-bottom:8px">Contratos a vencer em 30 dias</div>'
      +contratosVencer.slice(0,3).map(function(c){
        return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><span>'+esc(c.name||c.client||'—')+'</span><span style="color:var(--madeira);font-size:11px">'+fmtBR(c.endDate)+'</span></div>';
      }).join('')+'</div>':'')
    +(!etapasAtrasadas.length&&!atasPendentes.length&&!contratosVencer.length?'<div style="color:var(--verde);font-size:13px;display:flex;align-items:center;gap:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg> Tudo em dia.</div>':'')
    +'</div>'

    // Próximas reuniões
    +'<div class="card" style="padding:20px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700">Próximas reuniões</div>'
    +'<button class="btn ghost sm" id="dash-ver-agenda">Ver agenda</button>'
    +'</div>'
    +(reunioes.length?reunioes.map(function(l){
      var isHoje=l.reuniaoDate===hoje;
      return '<div style="padding:8px 0;border-bottom:1px solid var(--line)">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div><div style="font-size:13px;font-weight:600">'+esc(l.name)+'</div>'
        +'<div style="font-size:11px;color:var(--dim)">'+(l.reuniaoTime||'')+(l.reuniaoDate?' · '+fmtBR(l.reuniaoDate):'')+(l.reuniaoLocal?' · '+esc(l.reuniaoLocal):'')+'</div></div>'
        +(isHoje?'<span class="pill and" style="font-size:10px">Hoje</span>':'')
        +'</div></div>';
    }).join(''):'<div style="color:var(--faint);font-size:13px">Nenhuma reunião agendada.</div>')
    +'</div>'
    +'</div>' // dash-2col

    +'</div>'; // dash-home

  // Calendar section
  var calState=state.dashCalView||'mes';
  var calDate=state.dashCalDate||(hoje.slice(0,7));

  // Build calendar events
  var calEvents=[];
  // Reunioes com clientes
  leads.forEach(function(l){
    if(l.reuniaoDate){
      calEvents.push({
        id:'reu-'+l.id, title:l.name, date:l.reuniaoDate,
        time:l.reuniaoTime||'', type:'reuniao',
        color:'#7a3818', label:'Reuniao'
      });
    }
  });
  // Tarefas da equipe com prazo
  (db.projects||[]).forEach(function(p){
    (p.tasks||[]).forEach(function(t){
      if(t.dueDate&&t.status!=='concluido'){
        var assignee=t.assigneeId?db.users.find(function(u2){ return u2.id===t.assigneeId; }):null;
        calEvents.push({
          id:'tsk-'+t.id, title:t.name+(assignee?' ('+assignee.name.split(' ')[0]+')':''),
          date:t.dueDate, time:'', type:'tarefa',
          color:'#3F6273', label:'Tarefa'
        });
      }
    });
  });
  // Google Calendar events
  (db.googleCalEvents||[]).forEach(function(ge){
    if(ge.start) calEvents.push({
      id:'gcal-'+ge.id, title:ge.title, date:ge.start.slice(0,10),
      time:'', type:'google', color:'#1A73E8', label:'Google'
    });
  });

  function calEvtPill(ev){
    return '<div style="background:'+ev.color+'22;border-left:3px solid '+ev.color
      +';border-radius:3px;padding:2px 6px;margin-bottom:2px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer" data-caldate="'+ev.date+'" title="'+esc(ev.title)+'">'
      +esc(ev.title)+'</div>';
  }

  function buildDashCal(){
    var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    var MESES_S=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var navHtml='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">'
      +'<div style="display:flex;gap:6px"><button class="btn ghost sm" id="dcal-prev">◀</button>'
      +'<button class="btn ghost sm" id="dcal-today">Hoje</button>'
      +'<button class="btn ghost sm" id="dcal-next">▶</button></div>'
      +'<b style="flex:1;font-size:14px">'+calLabel()+'</b>'
      +'<div style="display:flex;gap:4px">'
      +'<button class="btn'+(calState==='mes'?' ':' ghost')+' sm" data-dv="mes">Mês</button>'
      +'<button class="btn'+(calState==='semana'?' ':' ghost')+' sm" data-dv="semana">Semana</button>'
      +'<button class="btn'+(calState==='dia'?' ':' ghost')+' sm" data-dv="dia">Dia</button>'
      +'</div></div>';
    var grid='';
    if(calState==='mes') grid=buildMes();
    else if(calState==='semana') grid=buildSemana();
    else grid=buildDia();
    return '<div class="card" style="padding:20px;margin-top:0">'+navHtml+grid+'</div>';
  }

  function calLabel(){
    var MESES_FULL2=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    if(calState==='mes'){ var p=calDate.split('-'); return MESES_FULL2[+p[1]-1]+' '+p[0]; }
    if(calState==='semana'){
      var ws=weekStart(calDate);
      var we=new Date(ws); we.setDate(we.getDate()+6);
      return ws.getDate()+'/'+(ws.getMonth()+1)+' – '+we.getDate()+'/'+(we.getMonth()+1)+'/'+we.getFullYear();
    }
    var d=new Date((calDate.length===7?calDate+'-01':calDate)+'T12:00:00');
    var DIAS2=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    return DIAS2[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  }

  function weekStart(dt){
    var d=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
    d.setDate(d.getDate()-d.getDay()); return d;
  }

  function eventsOn(date){ return calEvents.filter(function(e){ return e.date===date; }); }

  function buildMes(){
    var yr=+calDate.slice(0,4), mo=+calDate.slice(5,7)-1;
    var first=new Date(yr,mo,1).getDay();
    var days=new Date(yr,mo+1,0).getDate();
    var DIAS3=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    var h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)">';
    DIAS3.forEach(function(d){ h+='<div style="background:var(--surface);padding:4px;font-size:10px;font-weight:700;color:var(--faint);text-align:center">'+d+'</div>'; });
    for(var i=0;i<first;i++) h+='<div style="background:var(--surface-2);min-height:70px"></div>';
    for(var d2=1;d2<=days;d2++){
      var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
      var evs=eventsOn(ds);
      var isT=ds===hoje;
      h+='<div style="background:var(--surface);min-height:70px;padding:3px;'+(isT?'outline:2px solid var(--madeira);outline-offset:-2px':'')+'">'
        +'<div style="font-size:11px;font-weight:'+(isT?'800':'500')+';color:'+(isT?'var(--madeira)':'var(--ink-2)')+';margin-bottom:2px">'+d2+'</div>'
        +evs.slice(0,3).map(calEvtPill).join('')
        +(evs.length>3?'<div style="font-size:9px;color:var(--faint)">+' +(evs.length-3)+'</div>':'')
        +'</div>';
    }
    h+='</div>';
    return h;
  }

  function buildSemana(){
    var ws=weekStart(calDate);
    var DIAS4=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    var h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">';
    for(var i=0;i<7;i++){
      var d=new Date(ws); d.setDate(ws.getDate()+i);
      var ds=d.toISOString().slice(0,10);
      var evs=eventsOn(ds);
      var isT=ds===hoje;
      h+='<div style="background:'+(isT?'rgba(122,56,24,.06)':'var(--surface-2)')+';border-radius:8px;padding:8px;min-height:120px;border:1px solid '+(isT?'var(--madeira)':'var(--line)')+'">'
        +'<div style="font-size:10px;font-weight:700;color:var(--faint)">'+DIAS4[d.getDay()]+'</div>'
        +'<div style="font-size:14px;font-weight:800;color:'+(isT?'var(--madeira)':'var(--ink)')+';margin-bottom:6px">'+d.getDate()+'</div>'
        +evs.map(calEvtPill).join('')
        +'</div>';
    }
    h+='</div>';
    return h;
  }

  function buildDia(){
    var ds=calDate.length===7?calDate+'-01':calDate;
    var evs=eventsOn(ds);
    if(!evs.length) return '<div style="padding:32px;text-align:center;color:var(--faint)">Nenhum evento neste dia.</div>';
    return '<div style="display:flex;flex-direction:column;gap:8px">'+evs.map(function(ev){
      return '<div style="background:var(--surface-2);border:1px solid var(--line);border-left:4px solid '+ev.color+';border-radius:8px;padding:12px 16px">'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:10px;background:'+ev.color+'22;color:'+ev.color+';padding:2px 7px;border-radius:4px;font-weight:700">'+ev.label+'</span>'
        +'<span style="font-size:13px;font-weight:600">'+esc(ev.title)+'</span>'
        +(ev.time?'<span style="font-size:12px;color:var(--dim)">'+ev.time+'</span>':'')
        +'</div></div>';
    }).join('')+'</div>';
  }

  html+=buildDashCal();

  shell(html);

  // Binds
  var btn=document.getElementById('dash-ver-agenda');
  if(btn) btn.onclick=function(){ state.page='dashboard_agenda'; render(); };

  [].forEach.call(view.querySelectorAll('.dash-proj-row'),function(el){
    el.onclick=function(){
      state.crmSelId=el.dataset.id;
      state.crmView='detail';
      state.page='meus_projetos';
      render();
    };
  });

  // Calendar nav
  var dp=document.getElementById('dcal-prev');
  var dn=document.getElementById('dcal-next');
  var dt2=document.getElementById('dcal-today');
  if(dp) dp.onclick=function(){ state.dashCalDate=shiftCal(-1); render(); };
  if(dn) dn.onclick=function(){ state.dashCalDate=shiftCal(1); render(); };
  if(dt2) dt2.onclick=function(){ state.dashCalDate=hoje.slice(0,7); state.dashCalView='mes'; render(); };
  [].forEach.call(view.querySelectorAll('[data-dv]'),function(b){
    b.onclick=function(){ state.dashCalView=b.dataset.dv; render(); };
  });

  function shiftCal(dir){
    var cv=state.dashCalView||'mes';
    var dt=state.dashCalDate||(hoje.slice(0,7));
    if(cv==='mes'){
      var yr=+dt.slice(0,4), mo=+dt.slice(5,7)-1+dir;
      if(mo<0){ mo=11; yr--; } if(mo>11){ mo=0; yr++; }
      return yr+'-'+String(mo+1).padStart(2,'0');
    }
    if(cv==='semana'){
      var d=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
      d.setDate(d.getDate()+dir*7);
      return d.toISOString().slice(0,10);
    }
    var d2=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
    d2.setDate(d2.getDate()+dir);
    return d2.toISOString().slice(0,10);
  }
}

function modalTimeLog(projectId, stageId, stageName){
  var proj=db.crmProjects.find(function(p){ return p.id===projectId; });
  if(!proj) return;
  var logs=(db.timeLog||[]).filter(function(e){ return e.projectId===projectId&&(!stageId||e.stageId===stageId); }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var totalH=logs.reduce(function(s,e){ return s+(e.horas||0); },0);
  var ov=document.createElement('div'); ov.className='overlay';

  function draw(){
    var rows=logs.map(function(e,i){
      var u=db.users.find(function(u){ return u.id===e.userId; });
      return '<div class="frow"><div class="fd"><div class="t">'+esc(e.desc||'Sem descricao')+'</div>'
        +'<div class="c">'+(u?esc(u.name)+' · ':'')+fmtDate(e.date)+(e.stageName?' · '+esc(e.stageName):'')+'</div></div>'
        +'<span class="fv" style="color:var(--madeira);font-weight:700">'+e.horas+'h</span>'
        +(isAdmin()?'<button class="xdel tl-del" data-i="'+i+'">x</button>':'')
        +'</div>';
    }).join('');
    ov.innerHTML='<div class="modal"><h2>Registro de horas — '+esc(proj.client)+'</h2>'
      +'<div class="msub">'+(stageName?'Etapa: '+esc(stageName)+' · ':'')+'Total: <b>'+totalH+'h</b></div>'
      +'<div style="border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px">Registrar horas</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;margin-bottom:8px">'
      +'<div class="field" style="margin:0"><label style="font-size:11px">Etapa</label><select class="inp" id="tl-stage">'
      +'<option value="">Geral</option>'
      +proj.stages.map(function(s){ return '<option value="'+s.id+'"'+(s.id===stageId?' selected':'')+'>'+esc(s.code+' — '+s.name)+'</option>'; }).join('')
      +'</select></div>'
      +'<div class="field" style="margin:0"><label style="font-size:11px">Data</label><input class="inp" id="tl-date" type="date" value="'+today()+'"></div>'
      +'<div class="field" style="margin:0"><label style="font-size:11px">Horas</label><input class="inp" id="tl-horas" type="number" min="0.5" step="0.5" placeholder="2"></div>'
      +'</div>'
      +'<div class="field" style="margin:0"><label style="font-size:11px">Descricao</label><input class="inp" id="tl-desc" placeholder="Ex.: Desenvolvimento do estudo preliminar…"></div>'
      +'<div style="margin-top:10px"><button class="btn sm" id="tl-add">Registrar</button></div>'
      +'</div>'
      +(rows||'<div class="free">Nenhuma hora registrada ainda.</div>')
      +'<div class="modal-actions"><button class="btn ghost" id="tl-close">Fechar</button></div>'
      +'</div>';
    bind();
  }

  function bind(){
    ov.querySelector('#tl-close').onclick=function(){ ov.remove(); render(); };
    ov.onclick=function(e){ if(e.target===ov){ ov.remove(); render(); } };
    ov.querySelector('#tl-add').onclick=function(){
      var horas=parseFloat(ov.querySelector('#tl-horas').value)||0;
      if(horas<=0){ alert('Informe as horas.'); return; }
      var stSel=ov.querySelector('#tl-stage').value;
      var stObj=stSel?proj.stages.find(function(s){ return s.id===stSel; }):null;
      if(!db.timeLog) db.timeLog=[];
      db.timeLog.push({
        id:uid(), projectId:projectId, stageId:stSel||'',
        stageName:stObj?stObj.code+' — '+stObj.name:'',
        userId:me()?me().id:'', date:ov.querySelector('#tl-date').value||today(),
        horas:horas, desc:ov.querySelector('#tl-desc').value.trim()
      });
      save();
      // refresh logs
      logs=(db.timeLog||[]).filter(function(e){ return e.projectId===projectId&&(!stageId||e.stageId===stageId); }).sort(function(a,b){ return b.date.localeCompare(a.date); });
      totalH=logs.reduce(function(s,e){ return s+(e.horas||0); },0);
      draw();
    };
    [].forEach.call(ov.querySelectorAll('.tl-del'),function(b){
      b.onclick=function(){
        if(!confirm('Remover registro?')) return;
        var entry=logs[+b.dataset.i];
        db.timeLog=db.timeLog.filter(function(e){ return e.id!==entry.id; });
        save();
        logs=(db.timeLog||[]).filter(function(e){ return e.projectId===projectId&&(!stageId||e.stageId===stageId); }).sort(function(a,b){ return b.date.localeCompare(a.date); });
        totalH=logs.reduce(function(s,e){ return s+(e.horas||0); },0);
        draw();
      };
    });
  }
  document.getElementById('app-root').appendChild(ov);
  draw();
}

// Comparativo estimado vs real por projeto
function horasEstimadasProjeto(lead){
  if(!lead||!lead.precificacao||!lead.precificacao.stages) return 0;
  return lead.precificacao.stages.filter(function(s){ return !s.excluir&&!s.terceirizado; })
    .reduce(function(a,s){ return a+(s.horas||0)+(s.dias||0)*8; },0);
}
function horasReaisProjeto(crmProjectId){
  return (db.timeLog||[]).filter(function(e){ return e.projectId===crmProjectId; })
    .reduce(function(s,e){ return s+(e.horas||0); },0);
}

    +'<button class="btn" id="ata-salvar" style="display:none">Salvar ata</button>'
    +'</div></div>';

  document.getElementById('app-root').appendChild(ov);
  ov.querySelector('#ata-cancel').onclick=function(){ ov.remove(); };
  ov.onclick=function(e){ if(e.target===ov) ov.remove(); };

  ov.querySelector('#ata-organizar').onclick=function(){
    var raw=ov.querySelector('#ata-raw').value.trim();
    if(!raw){ alert('Descreva a reuniao primeiro.'); return; }
    var loading=ov.querySelector('#ata-loading');
    var preview=ov.querySelector('#ata-preview');
    var btn=ov.querySelector('#ata-organizar');
    loading.style.display='block'; preview.style.display='none'; btn.disabled=true;
    var stageEl=ov.querySelector('#ata-stage');
    var stageObj=stageEl.value?p.stages.find(function(s){ return s.id===stageEl.value; }):null;
    var ctx='Projeto: '+p.client+(stageObj?' | Etapa: '+stageObj.code+' — '+stageObj.name:'')+' | Escritorio: Airos Arquitetura';
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:2000,
        messages:[{role:'user',content:
          'Organize esta ata de reuniao em JSON com as chaves:\n'
          +'- ajustes: array de strings (ajustes e alteracoes pedidos)\n'
          +'- decisoes: array de strings (decisoes tomadas)\n'
          +'- pendencias: array de strings (itens em aberto)\n'
          +'- proximosPassos: array de strings com responsavel e prazo\n'
          +'- observacoes: string geral (pode ser vazio)\n'
          +'Contexto: '+ctx+'\n\nDescricao:\n'+raw+'\n\nResponda APENAS com o JSON, sem texto adicional, sem backticks.'
        }]
      })
    }).then(function(resp){ return resp.json(); }).then(function(data){
      var txt=data.content.filter(function(x){ return x.type==='text'; }).map(function(x){ return x.text; }).join('').trim();
      structured=JSON.parse(txt);
      function sec(title,items,color){
        if(!items||!items.length) return '';
        return '<div style="margin-bottom:14px"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:'+color+';margin-bottom:7px">'+title+'</div>'
          +'<ul style="margin:0;padding:0 0 0 18px;list-style:disc">'+items.map(function(i){ return '<li style="font-size:13.5px;line-height:1.7;margin-bottom:3px">'+esc(i)+'</li>'; }).join('')+'</ul></div>';
      }
      preview.innerHTML='<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:18px 20px">'
        +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:14px">Previa da ata organizada</div>'
        +sec('Ajustes e alteracoes solicitados',structured.ajustes,'var(--alerta)')
        +sec('Decisoes tomadas',structured.decisoes,'var(--verde)')
        +sec('Pendencias',structured.pendencias,'var(--ambar)')
        +sec('Proximos passos',structured.proximosPassos,'var(--madeira)')
        +(structured.observacoes?'<div style="font-size:13px;color:var(--dim);padding-top:10px;border-top:1px solid var(--line)">'+esc(structured.observacoes)+'</div>':'')
        +'</div>';
      loading.style.display='none'; preview.style.display='block';
      ov.querySelector('#ata-salvar').style.display='inline-flex';
      btn.textContent='Reorganizar'; btn.disabled=false;
    }).catch(function(e){
      loading.style.display='none'; btn.disabled=false;
      alert('Erro ao organizar com IA. Verifique a conexao.');
    });
  };

  ov.querySelector('#ata-salvar').onclick=function(){
    if(!structured){ alert('Organize a ata com IA primeiro.'); return; }
    var stageEl=ov.querySelector('#ata-stage');
    var stageObj=stageEl.value?p.stages.find(function(s){ return s.id===stageEl.value; }):null;
    var ata={
      id:uid(), ver:ver, ts:Date.now(),
      date:ov.querySelector('#ata-date').value||today(),
      stageId:stageObj?stageObj.id:'',
      stageName:stageObj?stageObj.code+' — '+stageObj.name:'Geral',
      raw:ov.querySelector('#ata-raw').value.trim(),
      structured:structured,
      ataNotes:'', ataStatus:'pendente',
      ataToken:uid()+uid()
    };
    if(!p.atas) p.atas=[];
    p.atas.push(ata);
    if(!p.history) p.history=[];
    p.history.push({ts:Date.now(),user:me()?me().name:'',action:'Ata v'+ver+' criada'+(stageObj?' — etapa '+stageObj.name:'')+'.'});
    save(); ov.remove(); render();
  };
}

// Confirmação do cliente (chamada via onclick inline)
function clientConfirmAta(token, status){
  var notes = document.getElementById('ata-client-notes');
  var notesVal = notes ? notes.value.trim() : '';
  var ata=null, proj=null;
  db.crmProjects.forEach(function(p){
    (p.atas||[]).forEach(function(a){ if(a.ataToken===token){ ata=a; proj=p; } });
  });
  if(!ata) return;
  ata.ataNotes = notesVal;
  ata.ataStatus = status;
  if(!proj.history) proj.history=[];
  proj.history.push({ts:Date.now(),user:proj.client+' (cliente)',action:'Ata v'+ata.ver+' '+(status==='confirmado'?'confirmada sem alteracoes.':'confirmada com ressalvas.')});
  save();
  // show confirmation without full re-render (we're in client view)
  var form = document.getElementById('ata-client-form');
  if(form) form.outerHTML='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:20px 24px;text-align:center"><div style="font-size:20px;margin-bottom:6px">✓</div><div style="font-size:15px;font-weight:600;color:#166534">'+(status==='confirmado'?'Ata confirmada sem alteracoes':'Ata confirmada com ressalvas')+'</div><div style="font-size:13px;color:#555;margin-top:4px">Obrigado. Sua confirmacao foi registrada.</div></div>';
}


function syncGoogleCalIfNeeded(){
  if(!db.googleCalIcal) return;
  var lastSync=db.googleCalLastSync||0;
  if(Date.now()-lastSync<3600000) return;
  var url=db.googleCalIcal;
  fetch('/.netlify/functions/ical-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})})
    .then(function(r){ return r.text(); })
    .then(function(text){
      if(text&&text.indexOf('BEGIN:VCALENDAR')>=0){
        db.googleCalEvents=parseIcal(text);
        db.googleCalLastSync=Date.now();
        save();
      }
    }).catch(function(){});
}

function runMigrations(){
  if(!db.accessLog) db.accessLog=[];
  if(!db.hourlyRates) db.hourlyRates={};
  if(!db.m2Reference) db.m2Reference={arquitetura:150,interiores:120,arq_int:130,consultoria:200};
  if(!db.impostoRate) db.impostoRate=0;
  if(!db.bdiRate) db.bdiRate=20;
  if(!db.contingenciaRate) db.contingenciaRate=8;
  if(!db.complexidade) db.complexidade=1.0;
  if(!db.custoFixoMensal) db.custoFixoMensal=0;
  if(!db.notifs) db.notifs=[];

function icalDateToISO(dt){
  if(!dt) return '';
  var d=dt.replace(/Z$/,'').replace(/[^0-9T]/g,'');
  if(d.length===8) return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  if(d.length>=15) return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  return '';
}

function parseIcal(raw){
  var events=[];
  var lines=raw.split('\n');
  var ev=null;
  lines.forEach(function(line){
    line=line.replace(/\r$/,'');
    if(line==='BEGIN:VEVENT'){ ev={}; return; }
    if(line==='END:VEVENT'){
      if(ev&&ev.start&&ev.summary){
        events.push({id:ev.uid||uid(),title:ev.summary,start:icalDateToISO(ev.start),end:icalDateToISO(ev.end||ev.start),allDay:ev.start.indexOf('T')<0,location:ev.location||'',description:ev.description||'',source:'google'});
      }
      ev=null; return;
    }
    if(!ev) return;
    var col=line.indexOf(':');
    if(col<0) return;
    var key=line.slice(0,col).split(';')[0].toUpperCase();
    var val=line.slice(col+1);
    if(key==='SUMMARY') ev.summary=val;
    else if(key==='DTSTART') ev.start=val;
    else if(key==='DTEND') ev.end=val;
    else if(key==='UID') ev.uid=val;
    else if(key==='LOCATION') ev.location=val;
    else if(key==='DESCRIPTION') ev.description=val;
  });
  return events;
}

function generateNotifs(){
  if(!db.notifs) db.notifs=[];
  var hoje=today();
  var generated=[];
  // Reunioes amanha
  var amanha=new Date(); amanha.setDate(amanha.getDate()+1);
  var amanhaStr=amanha.toISOString().slice(0,10);
  (db.leads||[]).forEach(function(l){
    if(l.status==='reuniao'&&l.reuniaoDate===amanhaStr){
      generated.push({id:'reu-'+l.id,type:'reuniao',text:'Reuniao amanha com '+l.name,date:amanhaStr,read:false});
    }
  });
  // Etapas atrasadas
  (db.crmProjects||[]).forEach(function(p){
    (p.stages||[]).forEach(function(s){
      if(s.end&&s.end<hoje&&s.status!=='concluido'){
        generated.push({id:'eta-'+p.id+'-'+s.id,type:'atraso',text:'Etapa atrasada: '+p.client+' — '+s.name,date:s.end,read:false});
      }
    });
  });
  // Merge with existing
  var existingIds=db.notifs.map(function(n){ return n.id; });
  generated.forEach(function(n){
    if(existingIds.indexOf(n.id)<0) db.notifs.push(n);
  });
}

      var notesEl=document.getElementById('cli-ata-notes-'+ata.id);

    buildClienteView(p);
  };
}


function modalPrecificacao(lead){
  var tipo = lead.projType||'arq_int';
  var tplStages = (db.crmTemplates[tipo]||db.crmTemplates.arq_int||[]);

  var prec = lead.precificacao ? JSON.parse(JSON.stringify(lead.precificacao)) : {
    area: lead.briefing&&lead.briefing.area?parseFloat(lead.briefing.area)||0:0,
    tipo: tipo,
    margem: 30,
    desconto: 0,
    stages: tplStages.map(function(s){ return {code:s.code, name:s.name, userId:'', horas:0}; })
  };
  tplStages.forEach(function(s){
    if(!prec.stages.find(function(ps){ return ps.code===s.code; })){
      prec.stages.push({code:s.code,name:s.name,userId:'',horas:0});
    }
  });

  var ov = document.createElement('div'); ov.className='overlay';

  function calc(){
    var custoBase = prec.stages.reduce(function(sum,s){
      var rate = s.userId&&db.hourlyRates[s.userId]?db.hourlyRates[s.userId]:0;
      return sum + (s.horas||0)*rate;
    },0);
    var comMargem = custoBase / (1 - (prec.margem||0)/100);
    var comDesconto = comMargem * (1 - (prec.desconto||0)/100);
    var m2val = prec.area>0 ? comDesconto/prec.area : 0;
    var refM2 = db.m2Reference[prec.tipo]||150;
    var totalHoras = prec.stages.reduce(function(s,st){ return s+(st.horas||0); },0);
    return {custoBase:custoBase, comMargem:comMargem, final:comDesconto, m2val:m2val, refM2:refM2, totalHoras:totalHoras};
  }

  function fmtM(v){ return 'R$ '+Math.round(v).toLocaleString('pt-BR'); }

  function draw(){
    var r = calc();
    var userOpts = '<option value="">Selecionar...</option>'
      + db.users.map(function(u){
          var rate = db.hourlyRates[u.id]||0;
          return '<option value="'+u.id+'">'+esc(u.name)+(rate?' (R$'+rate+'/h)':'')+'</option>';
        }).join('');

    var diff = r.refM2>0 && r.m2val>0 ? Math.round((r.m2val-r.refM2)/r.refM2*100) : null;
    var diffLabel = diff===null?'—':diff>20?'Acima da referencia (bom)':diff>0?'Levemente acima':diff>-20?'Levemente abaixo':'Abaixo da referencia';

    ov.innerHTML = '<div class="modal wide" style="max-width:760px">'
      +'<div style="background:var(--madeira);color:#F6F4F1;padding:14px 20px;border-radius:12px 12px 0 0;margin:-20px -20px 20px">'
      +'<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.7;margin-bottom:2px">Precificacao</div>'
      +'<h2 style="margin:0;font-size:20px;color:#F6F4F1">'+esc(lead.name)+'</h2>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">'
      +'<div class="field"><label>Area (m²)</label><input class="inp" id="pc-area" type="number" min="0" step="1" value="'+(prec.area||0)+'"></div>'
      +'<div class="field"><label>Margem de lucro (%)</label><input class="inp" id="pc-margem" type="number" min="0" max="90" step="1" value="'+(prec.margem||30)+'"></div>'
      +'<div class="field"><label>Desconto (%)</label><input class="inp" id="pc-desconto" type="number" min="0" max="50" step="1" value="'+(prec.desconto||0)+'"></div>'
      +'</div>'
      +'<div style="border-top:1px solid var(--line);padding-top:14px;margin-bottom:14px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px">Taxa por profissional (R$/hora)</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">'
      + db.users.map(function(u){
          var rate = db.hourlyRates[u.id]||0;
          return '<div class="field" style="margin:0"><label style="font-size:12px">'+esc(u.name)+'</label>'
            +'<input class="inp hr-inp" data-uid="'+u.id+'" type="number" min="0" step="10" value="'+rate+'" style="font-size:13px"></div>';
        }).join('')
      +'</div></div>'
      +'<div style="border-top:1px solid var(--line);padding-top:14px;margin-bottom:4px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:8px">Horas por etapa</div>'
      +'<div style="display:grid;grid-template-columns:60px 1fr 1fr 80px 90px;font-size:11px;font-weight:700;color:var(--faint);padding:0 4px 6px;border-bottom:1px solid var(--line)">'
      +'<span>Cod.</span><span>Etapa</span><span>Profissional</span><span>Horas</span><span style="text-align:right">Valor</span></div>'
      + prec.stages.map(function(s,i){
          var rate = s.userId&&db.hourlyRates[s.userId]?db.hourlyRates[s.userId]:0;
          var val = (s.horas||0)*rate;
          return '<div style="display:grid;grid-template-columns:60px 1fr 1fr 80px 90px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center">'
            +'<span style="font-size:12px;font-weight:700;color:var(--madeira)">'+esc(s.code)+'</span>'
            +'<span style="font-size:13px">'+esc(s.name)+'</span>'
            +'<select class="inp st-user" data-i="'+i+'" style="font-size:12px;padding:4px 6px">'+userOpts.replace('value="'+s.userId+'"','value="'+s.userId+'" selected')+'</select>'
            +'<input class="inp st-horas" data-i="'+i+'" type="number" min="0" step="0.5" value="'+(s.horas||0)+'" style="font-size:13px;padding:4px 8px">'
            +'<span style="font-size:12.5px;font-weight:600;text-align:right;padding-right:4px">'+fmtM(val)+'</span>'
            +'</div>';
        }).join('')
      +'<div style="display:flex;justify-content:flex-end;gap:24px;padding:10px 4px 0;font-size:13px;font-weight:700;border-top:1px solid var(--line)">'
      +'<span style="color:var(--faint)">'+r.totalHoras+'h totais</span>'
      +'<span style="color:var(--madeira)">Custo: '+fmtM(r.custoBase)+'</span>'
      +'</div></div>'
      +'<div style="border-top:2px solid var(--line);margin-top:16px;padding-top:16px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:12px">Resultado</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px">'
      +'<div class="kpi"><div class="v">'+fmtM(r.custoBase)+'</div><div class="l">Custo da equipe</div></div>'
      +'<div class="kpi"><div class="v">'+fmtM(r.comMargem)+'</div><div class="l">Com margem '+( prec.margem||0)+'%</div></div>'
      +(prec.desconto>0?'<div class="kpi"><div class="v">'+fmtM(r.final)+'</div><div class="l">Com desconto '+(prec.desconto||0)+'%</div></div>':'')
      +'<div class="kpi" style="border:2px solid var(--madeira)"><div class="v" style="color:var(--madeira)">'+fmtM(r.final)+'</div><div class="l">Valor final sugerido</div></div>'
      +'</div>'
      +(r.m2val>0?'<div style="background:'+(diff!==null&&diff<-20?'var(--alerta)':'var(--verde)')+';color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
        +'<div><div style="font-size:13px;font-weight:700">'+diffLabel+'</div>'
        +(diff!==null?'<div style="font-size:12px;opacity:.85">Seu valor esta '+Math.abs(diff)+'% '+(diff>0?'acima':'abaixo')+' da referencia</div>':'')
        +'</div>'+(diff!==null?'<div style="font-size:24px;font-weight:800">'+(diff>0?'+':'')+diff+'%</div>':'')
        +'</div>':'')
      +'</div>'
      +'<div class="modal-actions" style="margin-top:16px">'
      +'<button class="btn ghost" id="pc-cancel">Cancelar</button>'
      +'<button class="btn ghost" id="pc-calc">Recalcular</button>'
      +'<button class="btn" id="pc-save">Salvar precificacao</button>'
      +'</div></div>';

    bind();
  }

  function readAndRecalc(){
    prec.area = parseFloat(ov.querySelector('#pc-area').value)||0;
    prec.margem = parseFloat(ov.querySelector('#pc-margem').value)||30;
    prec.desconto = parseFloat(ov.querySelector('#pc-desconto').value)||0;
    [].forEach.call(ov.querySelectorAll('.hr-inp'),function(inp){
      if(inp.dataset.uid){ db.hourlyRates[inp.dataset.uid]=parseFloat(inp.value)||0; }
    });
    [].forEach.call(ov.querySelectorAll('.st-user'),function(sel){
      prec.stages[+sel.dataset.i].userId=sel.value;
    });
    [].forEach.call(ov.querySelectorAll('.st-horas'),function(inp){
      prec.stages[+inp.dataset.i].horas=parseFloat(inp.value)||0;
    });
  }

  function bind(){
    ov.querySelector('#pc-cancel').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.querySelector('#pc-calc').onclick=function(){ readAndRecalc(); draw(); };
    [].forEach.call(ov.querySelectorAll('.st-horas,.st-user,.hr-inp,#pc-area,#pc-margem,#pc-desconto'),function(el){
      el.onchange=function(){ readAndRecalc(); draw(); };
    });
    ov.querySelector('#pc-save').onclick=function(){
      readAndRecalc();
      var r=calc();
      lead.precificacao=JSON.parse(JSON.stringify(prec));
      lead.precificacao._resultado={custo:r.custoBase,final:r.final,m2val:r.m2val,refM2:r.refM2,totalHoras:r.totalHoras,ts:Date.now()};
      if(r.final>0&&(!lead.value||lead.value===0)){
        lead.value=Math.round(r.final/100)*100;
      }
      save(); ov.remove(); render();
    };
  }

  document.getElementById('app-root').appendChild(ov);
  draw();
}

        +'<div class="fd"><div class="t">Parcela '+(i+1)+' de '+contract.installments.length+'</div>'
        +'<div class="c">'+(pa.pct||0)+'% - '+fmtMoney(parcValue(contract,pa))+'</div></div>'
        +'<span class="fdue'+(late?' late':'')+'">'+( late?'Vencida: ':'')+( pa.due?fmtDate(pa.due):'--')+'</span>'
        +(pa.boleto?'<a class="btn ghost sm" href="'+esc(pa.boleto)+'" target="_blank">Ver boleto</a>':'<span style="color:var(--faint);font-size:12px">--</span>')
        +'<span class="pstat '+(pa.status==='pago'?'pago':(late?'atras':'pend'))+'" style="cursor:default">'+(pa.status==='pago'?'Pago':(late?'Atrasado':'Pendente'))+'</span>'
        +'</div>';
    }).join('');
    return '<div class="kpis" style="margin-bottom:18px">'
      +'<div class="kpi hl"><div class="v">'+fmtMoney(contract.value)+'</div><div class="l">Valor total</div></div>'
      +'<div class="kpi good"><div class="v">'+fmtMoney(paid)+'</div><div class="l">Pago</div></div>'
      +'<div class="kpi '+(pend>0?'bad':'good')+'"><div class="v">'+fmtMoney(pend)+'</div><div class="l">A pagar</div></div>'
      +'<div class="kpi"><div class="v">'+pct2+'%</div><div class="l">Quitado</div></div>'
      +'</div>'
      +(contract.condition?'<div style="font-size:13px;color:var(--dim);margin-bottom:14px">Condicao: '+esc(contract.condition)+'</div>':'')
      +'<div class="panel" style="padding:0">'+(parc||'<div class="free" style="padding:14px">Nenhuma parcela.</div>')+'</div>';
  }

  function svContrato(){
    if(!contract||!contract.contratoUrl) return '';
    return '<div class="panel" style="margin-bottom:14px">'
      +'<div style="font-size:14px;font-weight:600;margin-bottom:10px">Contrato assinado</div>'
      +'<div class="frow"><div class="fd"><div class="t">'+esc(contract.contratoName||'Contrato.pdf')+'</div><div class="c">Documento do projeto</div></div>'
      +'<a class="btn ghost sm" href="'+contract.contratoUrl+'" target="_blank" download="'+esc(contract.contratoName||'contrato.pdf')+'">Download PDF</a></div>'
      +'</div>';
  }
  function svAnotacoes(){
    var lks=(p.links||[]).map(function(lk){
      return '<div class="frow"><div class="fd">'
        +'<div class="t"><a href="'+esc(lk.url)+'" target="_blank" style="color:var(--madeira);font-weight:600">'+esc(lk.title||lk.url)+'</a></div>'
        +'<div class="c">'+esc(lk.desc||'')+'</div></div>'
        +'<a class="btn ghost sm" href="'+esc(lk.url)+'" target="_blank">Abrir</a>'
        +'</div>';
    }).join('');
    return svContrato()+(p.notes?'<div class="panel" style="margin-bottom:14px"><div style="font-size:14px;font-weight:600;margin-bottom:10px">Anotacoes</div><div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">'+esc(p.notes)+'</div></div>':'')
      +'<div class="panel" style="padding:0"><div class="phead" style="margin:0;padding:14px 16px 8px">'
      +'<div><h1 style="font-size:15px">Documentos e arquivos</h1>'
      +'<div class="sub">Clique para acessar os arquivos do seu projeto.</div></div></div>'
      +(lks||'<div class="free" style="padding:14px">Nenhum arquivo disponivel ainda.</div>')
      +'</div>';
  }

  var bodyHtml=tab==='geral'?svGeral():tab==='tarefas'?svTarefas():tab==='financeiro'?svFinanceiro():svAnotacoes();

  view.innerHTML='<div class="share-view">'
    +'<div class="share-top">'
    +'<img src="'+LOGO+'" alt="Airos" style="height:34px;filter:brightness(0) invert(1)">'
    +'<div><div class="t">'+esc(p.client)+'</div><div class="s">'+(CRM_TIPO_LABEL[p.type]||'')+' - Acompanhamento</div></div>'
    +'<div style="margin-left:auto"><span class="pill '+(pct===100?'con':'and')+'">'+pct+'% concluido</span></div>'
    +'</div>'
    +'<div style="background:var(--surface);border-bottom:1px solid var(--line);padding:0 28px">'
    +'<div style="max-width:760px;margin:0 auto;display:flex">'
    +'<button class="ate-tab'+(tab==='geral'?' active':'')+'" id="sv-geral">Geral</button>'
    +'<button class="ate-tab'+(tab==='tarefas'?' active':'')+'" id="sv-tarefas">Tarefas</button>'
    +'<button class="ate-tab'+(tab==='financeiro'?' active':'')+'" id="sv-financeiro">Financeiro</button>'
    +'<button class="ate-tab'+(tab==='anotacoes'?' active':'')+'" id="sv-anotacoes">Documentos</button>'
    +'</div></div>'
    +'<div style="max-width:760px;margin:0 auto;padding:24px 28px 80px">'
    +'<div class="phead"><div><h1>'+esc(p.client)+'</h1>'
    +'<div class="sub">'+(p.address?esc(p.address)+' - ':'')+(CRM_TIPO_LABEL[p.type]||'')+'</div></div></div>'
    +'<div class="traco" style="max-width:400px;margin-bottom:22px"><i style="width:'+pct+'%"></i></div>'
    +bodyHtml
    +'<div style="text-align:center;margin-top:48px;font-size:12px;color:var(--faint)">Airos Arquitetura - Historias contadas pela forma.</div>'
    +'</div></div>';

  ['geral','tarefas','financeiro','anotacoes'].forEach(function(t){
    var btn=document.getElementById('sv-'+t);
    if(btn) btn.onclick=function(){ state.shareTab=t; renderShareView(token); };
  });
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();
// supaLoad removed from auto-boot to prevent data loss
// Use Configuracoes > Sincronizar to manually sync
window._airos={
    push:function(){ supaPush(db); },
    load:function(){ supaLoad(); },
    isReady:function(){ return _supaReady; },
    syncCal:function(){
      var url=db.googleCalIcal;
      if(!url){ console.error('No iCal URL'); return; }
      fetch('/.netlify/functions/ical-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})})
        .then(function(r){ return r.text(); })
        .then(function(t){
          if(t&&t.indexOf('BEGIN:VCALENDAR')>=0){
            db.googleCalEvents=parseIcal(t);
            db.googleCalLastSync=Date.now();
            save(); render();
            console.log('SUCCESS:',db.googleCalEvents.length,'eventos carregados');
          } else { console.error('Invalid response'); }
        }).catch(function(e){ console.error('Fetch error:',e.message); });
    },
    parseIcal:parseIcal,
    getDb:function(){ return db; },
    save:save,
    render:render
  };

})();
</script>
</div>
