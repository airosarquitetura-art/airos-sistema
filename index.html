<!DOCTYPE html><!-- v9-1787313619 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airos Arquitetura — Gestão do Estúdio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&display=swap">
<div id="app-root">
<style>



  @import url('https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&display=swap');

  #app-root{
    --bg:#F6F4F1; --surface:#FFFFFF; --surface-2:#FBFAF8;
    --line:#E9E4DD; --line-strong:#DCD5CC;
    --ink:#171614; --ink-2:#4b463f; --dim:#8B857C; --faint:#B4AEA4;
    --madeira:#7a3818; --madeira-soft:#F3E9E2;
    --verde:#4E7A4E; --verde-soft:#EAF1E8;
    --ambar:#9A5B22; --ambar-soft:#F6EDE0;
    --azul:#3F6273; --azul-soft:#E8EFF2;
    --cinza-soft:#EEEDEA;
    --alerta:#B03D24; --alerta-soft:#F8E9E4;
    --disp:'Fraunces',Georgia,serif; --sans:'Familjen Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --shadow:0 1px 2px rgba(23,22,20,.04), 0 4px 16px rgba(23,22,20,.04);
    all:revert; box-sizing:border-box;
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased; font-size:14px;
  }
  #app-root *,#app-root *::before,#app-root *::after{ box-sizing:border-box; }

  /* ================= LAYOUT ================= */
  .shell{ display:flex; min-height:100vh; }
  .side{ width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .side-logo{ padding:16px 20px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; background:#fff; margin:-1px; }
  .side-logo img{ max-width:140px; display:block; }
  .side-logo .name{ font-family:var(--disp); font-weight:400; font-size:17px; letter-spacing:.22em; }
  .side-logo .sub{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:2px; }
  .side-nav{ padding:6px 12px 4px; display:flex; flex-direction:column; gap:2px; }
  .snav{ all:unset; cursor:pointer; font-family:var(--sans); font-size:13.5px; font-weight:500; color:var(--ink-2); padding:9px 12px; border-radius:8px; display:flex; align-items:center; gap:10px; transition:background .15s, color .15s; }
  .snav svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.75; flex:none; }
  .snav:hover{ background:var(--surface-2); color:var(--ink); }
  .snav.active{ background:var(--cinza-soft); color:var(--ink); font-weight:600; }
  .snav.active svg{ opacity:1; }
  .snav:focus-visible{ outline:2px solid var(--madeira); outline-offset:1px; }
  .side-sec{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:16px 14px 4px; font-weight:700; }
  .side-foot{ margin-top:auto; border-top:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .side-foot:hover{ background:var(--surface-2); }
  .avatar{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; background:var(--ink); flex:none; letter-spacing:.02em; }
  .side-foot .n{ font-size:13px; font-weight:600; line-height:1.2; }
  .side-foot .r{ font-size:11px; color:var(--dim); }
  .side-foot .out{ margin-left:auto; font-size:11px; color:var(--faint); }
  .main{ flex:1; min-width:0; }
  .content{ max-width:1100px; margin:0 auto; padding:36px 40px 90px; }
  @media(max-width:860px){
    .shell{ flex-direction:column; }
    .side{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; flex-wrap:wrap; padding:0; overflow:visible; }
    .side-logo{ border-bottom:none; padding:14px 18px; }
    .side-nav{ flex-direction:row; padding:8px 12px; overflow-x:auto; flex:1; }
    .side-sec{ display:none; }
    .side-foot{ margin-top:0; border-top:none; padding:10px 16px; }
    .side-foot .meta{ display:none; }
    .content{ padding:24px 18px 70px; }
  }

  /* ================= PAGE HEAD / ALERTS ================= */
  .phead{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .phead h1{ font-size:21px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .phead .sub{ font-size:13px; color:var(--dim); margin-top:3px; max-width:640px; }
  .crumb{ all:unset; cursor:pointer; font-size:12.5px; color:var(--dim); margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }
  .crumb:hover{ color:var(--ink); }
  .alertbox{ background:var(--alerta-soft); border:1px solid #EBC7BB; border-radius:12px; padding:14px 18px; margin-bottom:20px; }
  .alertbox .at{ font-size:13px; font-weight:700; color:var(--alerta); display:flex; align-items:center; gap:8px; }
  .alertbox ul{ margin:8px 0 0; padding:0 0 0 2px; list-style:none; }
  .alertbox li{ font-size:12.5px; color:var(--ink-2); padding:3px 0; cursor:pointer; }
  .alertbox li:hover{ color:var(--alerta); }
  .alertbox li b{ font-weight:600; }

  /* ================= BUTTONS / INPUTS ================= */
  .btn{ all:unset; cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:600; padding:9px 16px; border-radius:8px; background:var(--ink); color:#fff; transition:background .15s; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn:hover{ background:#332f2a; }
  .btn:focus-visible{ outline:2px solid var(--madeira); outline-offset:2px; }
  .btn.ghost{ background:var(--surface); border:1px solid var(--line-strong); color:var(--ink-2); font-weight:500; }
  .btn.ghost:hover{ background:var(--surface-2); color:var(--ink); }
  .btn.danger{ background:var(--surface); border:1px solid var(--line-strong); color:var(--alerta); font-weight:500; }
  .btn.danger:hover{ background:var(--alerta-soft); border-color:#E5C4BA; }
  .btn.sm{ padding:6px 12px; font-size:12.5px; }
  .inp, select.inp, input.inp, textarea.inp{ all:unset; font-family:var(--sans); font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:8px 11px; width:100%; transition:border-color .15s, box-shadow .15s; }
  select.inp{ cursor:pointer; }
  .inp:focus{ border-color:var(--madeira); box-shadow:0 0 0 3px rgba(122,56,24,.08); }
  input.inp[type=date]{ color-scheme:light; }
  .inp::placeholder{ color:var(--faint); }
  .inp:disabled, select.inp:disabled{ background:var(--surface-2); color:var(--dim); cursor:not-allowed; border-color:var(--line); }
  textarea.inp{ min-height:70px; resize:vertical; line-height:1.5; }
  .lockmsg{ font-size:12px; color:var(--faint); margin-top:10px; }
  .field-err{ font-size:12px; color:var(--alerta); margin-top:5px; }
  .okmsg{ font-size:12.5px; color:var(--verde); font-weight:600; margin-top:10px; }

  /* ================= CARDS ================= */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .pcard{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; cursor:pointer; transition:border-color .18s, box-shadow .18s; }
  .pcard:hover{ border-color:var(--line-strong); box-shadow:0 2px 4px rgba(23,22,20,.05), 0 10px 28px rgba(23,22,20,.07); }
  .pcard .tipo{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .pcard h3{ font-size:16.5px; font-weight:600; margin:6px 0 2px; letter-spacing:-.01em; }
  .pcard .meta{ font-size:12.5px; color:var(--dim); }
  .traco{ height:4px; background:var(--cinza-soft); border-radius:4px; margin:14px 0 12px; overflow:hidden; }
  .traco i{ display:block; height:100%; background:var(--madeira); border-radius:4px; transition:width .35s ease; }
  .pcard .stats{ display:flex; gap:12px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:1px; }
  .d-and{ background:var(--ambar); } .d-pau{ background:var(--faint); } .d-con{ background:var(--verde); }
  .late-flag{ font-size:11.5px; color:var(--alerta); font-weight:600; margin-top:10px; }
  .empty{ background:var(--surface); border:1px dashed var(--line-strong); border-radius:12px; padding:44px 28px; text-align:center; color:var(--dim); font-size:13.5px; }
  .empty .big{ font-size:15px; font-weight:600; color:var(--ink-2); margin-bottom:4px; }

  /* ================= TASK TABLE ================= */
  .tbl-head{ display:grid; grid-template-columns:minmax(190px,1.4fr) minmax(150px,1fr) 128px 128px 272px 36px; gap:10px; padding:10px 16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; }
  .trow{ display:grid; grid-template-columns:minmax(190px,1.4fr) minmax(150px,1fr) 128px 128px 272px 36px; gap:10px; align-items:center; padding:11px 16px; border-top:1px solid var(--line); background:var(--surface); transition:background .15s; }
  .trow:hover{ background:var(--surface-2); }
  .trow.done .tname{ color:var(--faint); text-decoration:line-through; text-decoration-color:var(--line-strong); }
  .tname{ font-size:13.5px; font-weight:500; line-height:1.3; }
  .tsub{ display:block; font-size:11px; color:var(--faint); font-weight:400; margin-top:1px; }
  .tsub.late{ color:var(--alerta); font-weight:600; }
  .overdue-date{ border-color:#E0B4A6 !important; color:var(--alerta) !important; }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; }
  .seg button{ all:unset; cursor:pointer; font-family:var(--sans); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:100px; border:1px solid var(--line-strong); color:var(--dim); background:var(--surface); transition:all .15s; }
  .seg button:hover:not(:disabled){ color:var(--ink); border-color:var(--faint); }
  .seg button:disabled{ cursor:not-allowed; opacity:.45; }
  .seg button.on-and{ background:var(--ambar-soft); border-color:#E3C9A8; color:var(--ambar); opacity:1; }
  .seg button.on-pau{ background:var(--cinza-soft); border-color:var(--line-strong); color:var(--ink-2); opacity:1; }
  .seg button.on-con{ background:var(--verde-soft); border-color:#C4D6C2; color:var(--verde); opacity:1; }
  .xdel{ all:unset; cursor:pointer; color:var(--faint); font-size:14px; border-radius:6px; width:26px; height:26px; display:grid; place-items:center; }
  .xdel:hover{ color:var(--alerta); background:var(--alerta-soft); }
  .wabtn{ all:unset; cursor:pointer; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--verde-soft); border:1px solid #C4D6C2; transition:background .15s; }
  .wabtn:hover{ background:#DDEBDA; }
  .wabtn svg{ width:15px; height:15px; fill:var(--verde); }
  .btn.wa{ background:var(--verde); }
  .btn.wa:hover{ background:#3F663F; }
  @media(max-width:960px){
    .tbl-head{ display:none; }
    .trow{ grid-template-columns:1fr 1fr; position:relative; padding:14px 16px; }
    .trow .tname{ grid-column:1/-1; padding-right:30px; }
    .trow .seg{ grid-column:1/-1; }
    .trow .xdel{ position:absolute; top:12px; right:12px; }
  }
  .addline{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .addline input{ flex:1; min-width:200px; }

  /* ================= PILLS / EQUIPE ================= */
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:100px; white-space:nowrap; }
  .pill.and{ background:var(--ambar-soft); color:var(--ambar); }
  .pill.pau{ background:var(--cinza-soft); color:var(--ink-2); }
  .pill.con{ background:var(--verde-soft); color:var(--verde); }
  .pill.late{ background:var(--alerta-soft); color:var(--alerta); }
  .pill.azul{ background:var(--azul-soft); color:var(--azul); }
  .pill.mad{ background:var(--madeira-soft); color:var(--madeira); }
  .ucard{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; }
  .ucard.haslate{ border-color:#EBC7BB; }
  .ucard-head{ display:flex; align-items:center; gap:11px; margin-bottom:12px; }
  .ucard-head .avatar{ width:36px; height:36px; font-size:12.5px; }
  .ucard-head h3{ font-size:15px; font-weight:600; margin:0; }
  .ucard-head .r{ font-size:11.5px; color:var(--dim); }
  .ucard-head .warn{ margin-left:auto; }
  .utask{ border-top:1px solid var(--line); padding:10px 0; cursor:pointer; }
  .utask:hover .t{ color:var(--madeira); }
  .utask .p{ font-size:11px; color:var(--faint); letter-spacing:.04em; }
  .utask .t{ font-size:13.5px; font-weight:500; margin-top:1px; transition:color .15s; }
  .utask .dl{ font-size:11.5px; color:var(--dim); margin-top:2px; }
  .utask .dl.late{ color:var(--alerta); font-weight:600; }
  .utask .st{ margin-top:5px; }
  .free{ font-size:12.5px; color:var(--faint); padding:12px 0 4px; border-top:1px solid var(--line); font-style:italic; }
  .ucount{ display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; }

  /* ================= CONFIG / CONTA ================= */
  .cfg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .cfg{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; }
  .cfg h3{ font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .cfg .hint{ font-size:12px; color:var(--dim); margin-bottom:12px; }
  .cfg-item{ display:flex; align-items:center; gap:9px; border-top:1px solid var(--line); padding:8px 0; font-size:13.5px; }
  .cfg-item .ord{ font-size:11px; color:var(--faint); width:18px; flex:none; font-weight:600; }
  .cfg-item span:not(.ord){ flex:1; }
  .cfg-add{ display:flex; gap:8px; margin-top:12px; }
  .cfg-add input{ flex:1; }
  .conta{ max-width:420px; }

  /* ================= OPORTUNIDADES ================= */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; }
  .kpi .v{ font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.1; }
  .kpi .l{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600; margin-top:4px; }
  .kpi.hl .v{ color:var(--madeira); }
  .kpi.bad .v{ color:var(--alerta); }
  .kpi.good .v{ color:var(--verde); }

  .two-col{ display:grid; grid-template-columns:1.25fr 1fr; gap:14px; margin-bottom:18px; }
  @media(max-width:900px){ .two-col{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; }
  .panel h3{ font-size:14px; font-weight:600; margin:0 0 3px; }
  .panel .hint{ font-size:12px; color:var(--dim); margin-bottom:14px; }
  .orow{ padding:9px 0; border-top:1px solid var(--line); }
  .orow .top{ display:flex; justify-content:space-between; gap:10px; font-size:13px; align-items:baseline; }
  .orow .top b{ font-weight:600; }
  .orow .top .nums{ color:var(--dim); font-size:12px; white-space:nowrap; }
  .orow .top .nums b{ color:var(--ink); }
  .obar{ height:6px; background:var(--cinza-soft); border-radius:6px; margin-top:7px; overflow:hidden; display:flex; }
  .obar i{ display:block; height:100%; }
  .obar .seg-fech{ background:var(--verde); }
  .obar .seg-neg{ background:var(--ambar); }
  .obar .seg-perd{ background:#D9A08E; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--dim); margin-top:12px; flex-wrap:wrap; }
  .legend .dot{ width:8px; height:8px; }
  .l-fech{ background:var(--verde);} .l-neg{ background:var(--ambar);} .l-perd{ background:#D9A08E;}
  .reason{ border-top:1px solid var(--line); padding:9px 0; font-size:12.5px; }
  .reason .who{ font-weight:600; }
  .reason .why{ color:var(--ink-2); margin-top:1px; }
  .reason .o{ font-size:11px; color:var(--faint); margin-top:1px; }

  .lead-tools{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .lead-tools select{ width:auto; min-width:150px; }
  .lead-head{ display:grid; grid-template-columns:minmax(170px,1.3fr) 130px 150px 170px 40px 36px; gap:10px; padding:10px 16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; }
  .lrow{ display:grid; grid-template-columns:minmax(170px,1.3fr) 130px 150px 170px 40px 36px; gap:10px; align-items:center; padding:11px 16px; border-top:1px solid var(--line); background:var(--surface); transition:background .15s; cursor:pointer; }
  .lrow:hover{ background:var(--surface-2); }
  .lname{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .lsub{ display:block; font-size:11px; color:var(--faint); font-weight:400; margin-top:1px; }
  .lorigin{ font-size:12.5px; color:var(--ink-2); }
  @media(max-width:900px){
    .lead-head{ display:none; }
    .lrow{ grid-template-columns:1fr auto; position:relative; padding:13px 16px; }
    .lrow .lname{ grid-column:1/-1; }
  }

  /* ================= ATENDIMENTO ================= */
  .ate-tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .ate-tab{ all:unset; cursor:pointer; font-family:var(--sans); font-size:13.5px; font-weight:500; padding:11px 20px; color:var(--dim); border-bottom:2px solid transparent; transition:color .15s,border-color .15s; }
  .ate-tab:hover{ color:var(--ink); }
  .ate-tab.active{ color:var(--ink); font-weight:600; border-bottom-color:var(--madeira); }
  .msg-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:20px; margin-bottom:14px; }
  .msg-card h3{ font-size:14px; font-weight:700; margin:0 0 3px; }
  .msg-card .hint{ font-size:12px; color:var(--dim); margin-bottom:12px; }
  .msg-body{ background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:13px 15px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .msg-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .ai-wrap{ display:flex; gap:16px; height:calc(100vh - 240px); min-height:420px; }
  .ai-side{ width:240px; flex:none; display:flex; flex-direction:column; gap:10px; }
  .ai-side .hint{ font-size:12px; color:var(--dim); }
  .ai-ctx{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12.5px; }
  .ai-ctx h4{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; font-weight:700; }
  .ai-ctx-item{ padding:7px 10px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--ink-2); margin-bottom:3px; border:1px solid var(--line); transition:background .15s; }
  .ai-ctx-item:hover{ background:var(--surface-2); }
  .ai-chat{ flex:1; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .ai-msgs{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .ai-bubble{ max-width:82%; border-radius:14px; padding:11px 14px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .ai-bubble.user{ align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .ai-bubble.ai{ align-self:flex-start; background:var(--cinza-soft); color:var(--ink); border-bottom-left-radius:4px; position:relative; }
  .ai-bubble.ai .copy-ai{ all:unset; cursor:pointer; font-size:10.5px; font-weight:600; color:var(--dim); border:1px solid var(--line-strong); border-radius:6px; padding:2px 8px; margin-top:8px; display:inline-block; }
  .ai-bubble.ai .copy-ai:hover{ color:var(--ink); background:var(--surface); }

function initials(n){ return n.trim().split(/\s+/).map(function(p){ return p[0]; }).slice(0,2).join('').toUpperCase(); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(d){ if(!d) return ''; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtTs(ts){ return new Date(ts).toLocaleDateString('pt-BR'); }
function today(){ return new Date().toISOString().slice(0,10); }
function isLate(t){ return t.end && t.status!=='concluido' && t.end < today(); }
function firstName(n){ return (n||'').trim().split(/\s+/)[0]||''; }
function curMonth(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shiftMonth(mk,delta){ var p=mk.split('-').map(Number),y=p[0],m=p[1]-1+delta; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
function monthLabel(mk){ var M=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']; var p=mk.split('-'); return M[+p[1]-1]+' de '+p[0]; }
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function parseMoney(s){ s=String(s||'').replace(/[R$\s]/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); var n=parseFloat(s); return isNaN(n)?0:Math.round(n*100)/100; }
function daysInMonth(mk){ var p=mk.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function dueInMonth(mk,day){ return mk+'-'+String(Math.min(day||1,daysInMonth(mk))).padStart(2,'0'); }

var LOGO = LOGO_DEFAULT;

function renderLogin(err){
  view.innerHTML = '<div class="login"><div class="login-card">'
    +'<div class="login-brand"><img src="'+LOGO+'" alt="Airos" style="width:200px;height:auto;display:block;margin:0 auto"></div>'
    +'<div class="login-tag">Gestao do estudio — projetos &amp; oportunidades</div>'
    +'<div class="login-panel" style="padding:24px">'
    +'<div class="field" style="margin-bottom:12px">'
    +'<label style="font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">Usuário</label>'
    +'<select class="inp" id="lg-user" style="margin-top:6px">'
    +'<option value="">Selecione seu usuário…</option>'
    +db.users.map(function(u){
      return '<option value="'+u.id+'">'+esc(u.name)+'</option>';
    }).join('')
    +'</select>'
    +'</div>'
    +'<div class="field" style="margin-bottom:16px">'
    +'<label style="font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">Senha</label>'
    +'<input class="inp" type="password" id="lg-pass" placeholder="Digite sua senha" style="margin-top:6px">'
    +'</div>'
    +(err?'<div style="color:var(--alerta);font-size:13px;margin-bottom:12px">'+esc(err)+'</div>':'')
    +'<button class="btn" id="lg-go" style="width:100%;padding:13px">Entrar</button>'
    +'</div>'
    +'</div></div>';

  var userSel = document.getElementById('lg-user');
  var passInp = document.getElementById('lg-pass');
  var btn = document.getElementById('lg-go');

  // Focus password when user selected
  if(userSel) userSel.onchange = function(){ if(passInp) passInp.focus(); };

  function tryLogin(){
    var uid2 = userSel ? userSel.value : '';
    var pass = passInp ? passInp.value : '';
    if(!uid2){ renderLogin('Selecione seu usuario.'); return; }
    var u = db.users.find(function(x){ return x.id===uid2; });
    if(!u){ renderLogin('Usuario nao encontrado.'); return; }
    var storedPass = u.password||u.pass||'';
    if(pass !== storedPass){ renderLogin('Senha incorreta.'); return; }
    db.sessionUserId = u.id;
    save(); render();
  }

  if(btn) btn.onclick = tryLogin;
  if(passInp) passInp.onkeydown = function(e){ if(e.key==='Enter') tryLogin(); };
}

function alertBanner(){
  if(!me()) return '';
  var late=[];
  db.projects.forEach(function(p){ p.tasks.forEach(function(t){ if(t.assigneeId===me().id&&isLate(t)) late.push({p:p,t:t}); }); });
  if(!late.length) return '';
  return '<div class="alertbox"><div class="at">Voce tem '+late.length+' tarefa'+(late.length===1?'':'s')+' com prazo vencido</div>'
    +'<ul>'+late.map(function(x){ return '<li data-p="'+x.p.id+'"><b>'+esc(x.t.name)+'</b> — '+esc(x.p.client)+' · fim em '+fmtDate(x.t.end)+'</li>'; }).join('')+'</ul></div>';
}
function bindAlert(){ [].forEach.call(view.querySelectorAll('.alertbox li'),function(li){ li.onclick=function(){ state.projectId=li.dataset.p; render(); }; }); }


// ── PROJETOS EM ANDAMENTO ─────────────────────────────────────────────────────
function buildProject(client,type){
  var tasks=(db.templates[type]||[]).map(function(n){ return {id:uid(),name:n,assigneeId:'',start:'',end:'',status:'pendente',startedAt:null,completedAt:null}; });
  return {id:uid(),client:client,type:type,createdAt:Date.now(),tasks:tasks};
}

function pageProjetos(){
  var list=db.projects.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  var cards=list.map(function(p){
    var tot=p.tasks.length,con=p.tasks.filter(function(t){ return t.status==='concluido'; }).length;
    var and=p.tasks.filter(function(t){ return t.status==='andamento'; }).length;
    var late=p.tasks.filter(isLate).length;
    var pct=tot?Math.round(con/tot*100):0;
    return '<div class="pcard" data-id="'+p.id+'">'
      +'<div class="tipo">'+(TIPOS[p.type]||'')+'</div>'
      +'<h3>'+esc(p.client)+'</h3>'
      +'<div class="meta">'+con+' de '+tot+' etapas · '+pct+'%</div>'
      +'<div class="traco"><i style="width:'+pct+'%"></i></div>'
      +'<div class="stats"><span><i class="dot d-and"></i>'+and+' em andamento</span></div>'
      +(late?'<div class="late-flag">'+late+' tarefa'+(late===1?'':'s')+' com prazo vencido</div>':'')
      +'</div>';
  }).join('');
  shell(alertBanner()
    +'<div class="phead"><div><h1>Projetos em andamento</h1><div class="sub">Acompanhe quem esta executando cada etapa e em qual prazo.</div></div>'
    +'<button class="btn" id="btn-new">+ Novo projeto</button></div>'
    +(list.length?'<div class="grid">'+cards+'</div>':'<div class="empty"><div class="big">Nenhum projeto cadastrado</div>Clique em "Novo projeto" para comecar.</div>'));
  bindAlert();
  document.getElementById('btn-new').onclick=function(){ modalNewProject(); };
  [].forEach.call(view.querySelectorAll('.pcard'),function(c){ c.onclick=function(){ state.projectId=c.dataset.id; render(); }; });
}

function modalNewProject(){
  var ov=document.createElement('div'); ov.className='overlay';
  var opts=Object.entries(TIPOS).map(function(e){ return '<option value="'+e[0]+'">'+e[1]+'</option>'; }).join('');
  ov.innerHTML='<div class="modal"><h2>Novo projeto</h2><div class="msub">As etapas do tipo entram automaticamente.</div>'
    +'<div class="field"><label>Cliente / projeto</label><input class="inp" id="np-client" placeholder="Ex.: Residencia Almeida"></div>'
    +'<div class="field"><label>Tipo de projeto</label><select class="inp" id="np-type">'+opts+'</select></div>'
    +'<div class="field"><label>Etapas incluidas</label><div class="preview" id="np-prev"></div></div>'
    +'<div class="modal-actions"><button class="btn ghost" id="np-cancel">Cancelar</button><button class="btn" id="np-ok">Criar projeto</button></div></div>';
  document.getElementById('app-root').appendChild(ov);
  var sel=ov.querySelector('#np-type'),prev=ov.querySelector('#np-prev');
  function upd(){ var arr=db.templates[sel.value]||[]; prev.innerHTML=arr.length?arr.map(function(t,i){ return '<b>'+(i+1)+'.</b> '+esc(t); }).join('<br>'):'Nenhuma etapa.'; }
  upd(); sel.onchange=upd;
  ov.querySelector('#np-client').focus();

    +(admin?'<button class="btn danger sm" id="del-proj">Excluir projeto</button>':'')
    +'</div>'
    +'<div class="traco" style="max-width:420px;margin:0 0 22px"><i style="width:'+pct+'%"></i></div>'
    +'<div class="card" style="overflow:hidden">'

    +(admin?'<div class="addline"><input class="inp" id="nt-name" placeholder="Adicionar etapa avulsa…"><button class="btn ghost sm" id="nt-add">Adicionar</button></div>':''));

function leadInPeriod(l,period){
  if(period==='all') return true;
  var d=new Date(l.createdAt),now=new Date();
  if(period==='month') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  if(period==='30') return (now-d)<=30*864e5;
  if(period==='90') return (now-d)<=90*864e5;
  return true;
}
function isInsta(o){ return /instagram/i.test(o); }

  if(!isAdmin()){ state.page='projetos'; return pageProjetos(); }

        var dias=Math.floor((hoje-l.propostaAt)/864e5);

  document.getElementById('app-root').appendChild(ov);

    var d=ov.querySelector('#ra-date').value, t=ov.querySelector('#ra-time').value, loc=ov.querySelector('#ra-local').value.trim();

    var tEnd=dt+'T'+String(hEnd).padStart(2,'0')+String(mm).padStart(2,'0')+'00';
    l.reuniaoDate=d; l.reuniaoTime=t; l.reuniaoLocal=loc; save();
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE'
      +'&text='+encodeURIComponent('Reuniao Airos — '+l.name)
      +'&dates='+tStart+'/'+tEnd
      +(loc?'&location='+encodeURIComponent(loc):'')

  ov.querySelector('#ra-wa').onclick=function(){
    var d=ov.querySelector('#ra-date').value, t=ov.querySelector('#ra-time').value, loc=ov.querySelector('#ra-local').value.trim();
    var phone=(l.contact||'').replace(/\D/g,''); if(!phone){ alert('Cadastre o WhatsApp deste lead.'); return; }
    var full=phone.startsWith('55')&&phone.length>=12?phone:'55'+phone;
    var msg=(db.waReuniaoTemplate||'').split('{nome}').join(firstName(l.name)).split('{data}').join(fmtDateBR(d)).split('{horario}').join(t||'—').split('{local}').join(loc||'');
    l.reuniaoDate=d; l.reuniaoTime=t; l.reuniaoLocal=loc; save();
    window.open('https://wa.me/'+full+'?text='+encodeURIComponent(msg),'_blank');
  };
}

function openWhatsApp(l){
  var phone=(l.contact||'').replace(/\D/g,''); if(!phone){ alert('Cadastre o WhatsApp deste lead.'); modalLead(l.id); return; }
  var full=phone.startsWith('55')&&phone.length>=12?phone:'55'+phone;
  var url='https://wa.me/'+full;
  var isFirst=!l.firstContactAt;
  if(isFirst){ var msg=(db.waTemplate||'').split('{nome}').join(firstName(l.name)); url+='?text='+encodeURIComponent(msg); l.firstContactAt=Date.now(); save(); }
  window.open(url,'_blank');
  if(isFirst) render();
}

    +'<button class="btn" id="pw-save">Salvar</button>'

function modalSubtarefas(ck, idx){
  var stage=db.crmTemplates[ck][idx];
  if(!stage) return;
  var ov=document.createElement('div'); ov.className='overlay';

  function draw(){
    var subs=stage.subtasks||[];
    ov.innerHTML='<div class="modal wide" style="max-width:560px">'
      +'<div style="background:var(--ink);color:#F6F4F1;padding:14px 20px;border-radius:12px 12px 0 0;margin:-20px -20px 20px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:2px">Etapa · '+esc(stage.code)+'</div>'
      +'<h2 style="margin:0;font-size:18px;color:#F6F4F1">'+esc(stage.name)+'</h2>'
      +'</div>'
      +'<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:10px">Subtarefas ('+subs.length+')</div>'
      +'<div id="sub-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">'
      +subs.map(function(s,i){
        return '<div class="cfg-item sub-drag-item" draggable="true" data-si="'+i+'" style="gap:8px">'
          +'<span style="color:var(--faint);font-size:14px;cursor:grab">⠿</span>'
          +'<input class="inp sub-name-inp" data-si="'+i+'" value="'+esc(s)+'" style="flex:1;padding:6px 10px;font-size:13px">'
          +'<button class="btn ghost sm sub-up" data-si="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
          +'<button class="btn ghost sm sub-dn" data-si="'+i+'"'+(i===subs.length-1?' disabled':'')+'>↓</button>'
          +'<button class="xdel sub-del" data-si="'+i+'" title="Remover">x</button>'
          +'</div>';
      }).join('')
      +'</div>'
      +'<div style="display:flex;gap:8px;margin-bottom:16px">'
      +'<input class="inp" id="sub-new-inp" placeholder="Nova subtarefa…" style="flex:1">'
      +'<button class="btn" id="sub-add">Adicionar</button>'
      +'</div>'
      +'<div class="modal-actions">'
      +'<button class="btn ghost" id="sub-cancel">Cancelar</button>'
      +'<button class="btn" id="sub-save">Salvar</button>'
      +'</div></div>';

    // binds
    ov.querySelector('#sub-cancel').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };

    ov.querySelector('#sub-add').onclick=function(){
      var v=ov.querySelector('#sub-new-inp').value.trim();
      if(!v) return;
      stage.subtasks.push(v);
      save(); draw();
    };
    ov.querySelector('#sub-new-inp').onkeydown=function(e){
      if(e.key==='Enter') ov.querySelector('#sub-add').click();
    };

    ov.querySelector('#sub-save').onclick=function(){
      var inputs=ov.querySelectorAll('.sub-name-inp');
      stage.subtasks=[].map.call(inputs,function(inp){ return inp.value.trim(); }).filter(Boolean);
      save(); ov.remove(); render();
    };

    [].forEach.call(ov.querySelectorAll('.sub-del'),function(btn){
      btn.onclick=function(){ stage.subtasks.splice(+btn.dataset.si,1); save(); draw(); };
    });
    [].forEach.call(ov.querySelectorAll('.sub-up'),function(btn){
      btn.onclick=function(){ var i=+btn.dataset.si; if(i===0) return; var t=stage.subtasks[i-1]; stage.subtasks[i-1]=stage.subtasks[i]; stage.subtasks[i]=t; save(); draw(); };
    });
    [].forEach.call(ov.querySelectorAll('.sub-dn'),function(btn){
      btn.onclick=function(){ var i=+btn.dataset.si; if(i>=stage.subtasks.length-1) return; var t=stage.subtasks[i+1]; stage.subtasks[i+1]=stage.subtasks[i]; stage.subtasks[i]=t; save(); draw(); };
    });

    // drag-and-drop
    var _ds=null;
    [].forEach.call(ov.querySelectorAll('.sub-drag-item'),function(el){
      el.ondragstart=function(e){ _ds=+el.dataset.si; el.style.opacity='0.4'; e.dataTransfer.effectAllowed='move'; };
      el.ondragend=function(){ el.style.opacity='1'; };
      el.ondragover=function(e){ e.preventDefault(); el.style.outline='2px solid var(--madeira)'; };
      el.ondragleave=function(){ el.style.outline=''; };
      el.ondrop=function(e){ e.preventDefault(); el.style.outline=''; var di=+el.dataset.si; if(_ds===di) return; var item=stage.subtasks.splice(_ds,1)[0]; stage.subtasks.splice(di,0,item); save(); draw(); };
    });
  }

  document.getElementById('app-root').appendChild(ov);
  draw();
}

var ALL_MODULES=[

function _permCheckboxes(prefix,curPerms){
  return ALL_MODULES.map(function(m){
    var chk=curPerms.indexOf(m.id)>=0;
    return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:7px 10px;border:1px solid '+(chk?'var(--madeira)':'var(--line)')+';border-radius:8px;background:'+(chk?'rgba(122,56,24,.06)':'')+'">'

  }).join('');
}

function modalNewUser(){
  var ov=document.createElement('div'); ov.className='overlay';
  function drawN(){
    var curRole=ov.querySelector('#nu-role2')?ov.querySelector('#nu-role2').value:'colab';
    var defP=['dashboard','projetos','meus_projetos','equipe'];
    ov.innerHTML='<div class="modal"><h2>Novo usuario</h2>'
      +'<div class="field"><label>Nome completo</label><input class="inp" id="nu-name2" placeholder="Nome completo"></div>'
      +'<div class="field"><label>Email</label><input class="inp" id="nu-email2" type="email" placeholder="email@exemplo.com"></div>'
      +'<div class="field-row"><div class="field"><label>Perfil</label><select class="inp" id="nu-role2"><option value="colab">Colaborador</option><option value="admin">Administrador</option></select></div>'
      +'<div class="field"><label>Senha inicial</label><input class="inp" id="nu-pass2" type="password" placeholder="Minimo 4 caracteres"></div></div>'
      +'<div id="nu-perms-wrap2" style="'+(curRole==='admin'?'display:none;':'')+'border-top:1px solid var(--line);margin:14px 0 0;padding-top:14px">'
      +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px">Modulos com acesso</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+_permCheckboxes('nu2',defP)+'</div>'
      +'<div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost sm" id="nu-all2">Tudo</button><button class="btn ghost sm" id="nu-none2">Nenhum</button></div>'
      +'</div>'
      +'<div class="field-err" id="nu-err2" style="display:none"></div>'
      +'<div class="modal-actions"><button class="btn ghost" id="nu-cancel2">Cancelar</button><button class="btn" id="nu-save2">Cadastrar</button></div></div>';
    ov.querySelector('#nu-cancel2').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.querySelector('#nu-role2').onchange=function(){ var w=ov.querySelector('#nu-perms-wrap2'); if(w) w.style.display=ov.querySelector('#nu-role2').value==='admin'?'none':''; };
    var sa=ov.querySelector('#nu-all2'); if(sa) sa.onclick=function(){ [].forEach.call(ov.querySelectorAll('.nu2-perm'),function(c){ c.checked=true; }); };
    var sn=ov.querySelector('#nu-none2'); if(sn) sn.onclick=function(){ [].forEach.call(ov.querySelectorAll('.nu2-perm'),function(c){ c.checked=false; }); };
    ov.querySelector('#nu-save2').onclick=function(){
      var name=ov.querySelector('#nu-name2').value.trim();
      var pass=ov.querySelector('#nu-pass2').value;
      var role=ov.querySelector('#nu-role2').value;
      var err=ov.querySelector('#nu-err2');
      if(!name){ err.textContent='Informe o nome.'; err.style.display='block'; return; }
      if(!pass||pass.length<4){ err.textContent='Senha de pelo menos 4 caracteres.'; err.style.display='block'; return; }
      var perms=role==='admin'?ALL_MODULES.map(function(m){ return m.id; })
        :ALL_MODULES.filter(function(m){ var c=ov.querySelector('.nu2-perm[data-mod="'+m.id+'"]'); return c&&c.checked; }).map(function(m){ return m.id; });
      db.users.push({id:uid(),name:name,email:ov.querySelector('#nu-email2').value.trim(),role:role,pass:pass,permissions:perms});
      save(); ov.remove(); render();
    };
  }
  document.getElementById('app-root').appendChild(ov); drawN();
}

async function sendAiMsg(userText,body){
  state.aiMessages.push({role:'user',content:userText});
  renderAteBody();
  var ms=document.getElementById('ai-msgs');
  if(ms){ var load=document.createElement('div'); load.className='ai-bubble ai loading'; load.id='ai-loading'; load.textContent='Pensando…'; ms.appendChild(load); ms.scrollTop=ms.scrollHeight; }
  try{
    var sys='Voce e um assistente de atendimento da Airos Arquitetura, escritorio de arquitetura de altissimo padrao fundado pelo arquiteto Matheus Fischer. Tom: proximo, humano, sofisticado, curto, objetivo. Nunca robotizado. Mensagens prontas para copiar e colar, sem explicacoes longas.';
    var hist=state.aiMessages.slice(-8,-1).map(function(m){ return (m.role==='user'?'Usuario: ':'Assistente: ')+m.content; }).join('\n\n');
    var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:sys+'\n\nHistorico:\n'+hist+'\n\nMensagem atual: '+userText}]})});
    var data=await resp.json();
    var text=data.content?data.content.filter(function(x){ return x.type==='text'; }).map(function(x){ return x.text; }).join(''):'Sem resposta.';
    state.aiMessages.push({role:'ai',content:text});
  }catch(e){ state.aiMessages.push({role:'ai',content:'Erro ao conectar com a IA. Verifique sua conexao.'}); }
  renderAteBody();
}

        events.push({
          projectId:p.id, client:p.client, stageName:s.name, code:s.code,
          start:s.start||s.end, end:s.end||s.start,
          status:s.status, profs:profs,
          color:s.status==='concluido'?'#27AE60':s.status==='andamento'?'#7a3818':'#C5CBCB'
        });
      });
    });

    // Nav controls
    var navHtml='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">'
      +'<div style="display:flex;gap:6px">'
      +'<button class="btn ghost sm" id="cal-prev">◀</button>'
      +'<button class="btn ghost sm" id="cal-today">Hoje</button>'
      +'<button class="btn ghost sm" id="cal-next">▶</button>'
      +'</div>'
      +'<b style="font-size:15px;flex:1">'+calLabel(cv,state.calDate)+'</b>'
      +'<div style="display:flex;gap:6px">'
      +'<button class="btn'+(cv==='mes'?' ':' ghost')+' sm" data-cv="mes">Mes</button>'
      +'<button class="btn'+(cv==='semana'?' ':' ghost')+' sm" data-cv="semana">Semana</button>'
      +'<button class="btn'+(cv==='dia'?' ':' ghost')+' sm" data-cv="dia">Dia</button>'
      +'</div></div>';

    var gridHtml='';
    if(cv==='mes') gridHtml=calMes(events);
    else if(cv==='semana') gridHtml=calSemana(events);
    else gridHtml=calDia(events);

    return '<div class="card" style="padding:16px">'+navHtml+gridHtml+'</div>';
  }

  function calLabel(cv,dt){
    var MESES_CAL=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    if(cv==='mes'){ var p=dt.split('-'); return MESES_CAL[+p[1]-1]+' '+p[0]; }
    if(cv==='semana'){
      var d=calWeekStart(dt);
      var e=new Date(d); e.setDate(e.getDate()+6);
      return d.getDate()+'/'+( d.getMonth()+1)+' – '+e.getDate()+'/'+(e.getMonth()+1)+'/'+e.getFullYear();
    }
    if(cv==='dia'){
      var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
      var d2=new Date(dt+'T12:00:00');
      return DIAS[d2.getDay()]+', '+d2.getDate()+'/'+(d2.getMonth()+1)+'/'+d2.getFullYear();
    }
    return dt;
  }

  function calWeekStart(dt){
    var d=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
    var day=d.getDay(); d.setDate(d.getDate()-day); return d;
  }

  function calEventsOn(events, dateStr){
    return events.filter(function(e){
      if(!e.start||!e.end) return false;
      return e.start<=dateStr&&dateStr<=e.end;
    });
  }

  function calEventPill(ev, compact){
    var prof=ev.profs.length?ev.profs[0].split(' ')[0]:'';
    var txt=compact
      ?'<span style="font-size:10px;font-weight:700">'+esc(ev.code)+'</span> <span style="font-size:10px">'+esc(ev.client)+'</span>'
      :'<b style="font-size:11.5px">'+esc(ev.code)+' '+esc(ev.client)+'</b>'+(prof?'<span style="font-size:11px;opacity:.8"> · '+esc(prof)+'</span>':'');
    return '<div style="background:'+ev.color+'22;border-left:3px solid '+ev.color+';border-radius:4px;padding:'+(compact?'2px 6px':'4px 8px')+';margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer" data-pid="'+ev.projectId+'">'+txt+'</div>';
  }

  function calMes(events){
    var yr=+state.calDate.slice(0,4), mo=+state.calDate.slice(5,7)-1;
    var firstDay=new Date(yr,mo,1).getDay();
    var daysInMonth=new Date(yr,mo+1,0).getDate();
    var todayStr=today();
    var DNAMES=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    var html='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)">';
    DNAMES.forEach(function(d){ html+='<div style="background:var(--surface);padding:6px;font-size:11px;font-weight:700;color:var(--faint);text-align:center">'+d+'</div>'; });
    // empty cells before first day
    for(var i=0;i<firstDay;i++) html+='<div style="background:var(--surface-2);min-height:80px"></div>';
    for(var d=1;d<=daysInMonth;d++){
      var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var evs=calEventsOn(events,ds);
      var isToday=ds===todayStr;
      html+='<div style="background:var(--surface);min-height:80px;padding:4px;'+(isToday?'outline:2px solid var(--madeira);outline-offset:-2px':'')+'">'
        +'<div style="font-size:11.5px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'var(--madeira)':'var(--ink-2)')+';margin-bottom:3px">'+d+'</div>'
        +evs.slice(0,3).map(function(e){ return calEventPill(e,true); }).join('')
        +(evs.length>3?'<div style="font-size:10px;color:var(--faint)">+' +(evs.length-3)+' mais</div>':'')
        +'</div>';
    }
    html+='</div>';
    return html;
  }

  function calSemana(events){
    var ws=calWeekStart(state.calDate.length===7?state.calDate+'-01':state.calDate);
    var days=[]; for(var i=0;i<7;i++){ var d=new Date(ws); d.setDate(ws.getDate()+i); days.push(d); }
    var todayStr=today();
    var DNAMES=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    var html='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">';
    days.forEach(function(d,i){
      var ds=d.toISOString().slice(0,10);
      var evs=calEventsOn(events,ds);
      var isToday=ds===todayStr;
      html+='<div style="background:'+(isToday?'rgba(122,56,24,.06)':'var(--surface-2)')+';border-radius:10px;padding:10px;min-height:140px;border:1px solid '+(isToday?'var(--madeira)':'var(--line)')+'">'
        +'<div style="font-size:11px;font-weight:700;color:var(--faint);margin-bottom:2px">'+DNAMES[d.getDay()]+'</div>'
        +'<div style="font-size:15px;font-weight:800;color:'+(isToday?'var(--madeira)':'var(--ink)')+';margin-bottom:8px">'+d.getDate()+'</div>'
        +evs.map(function(e){ return calEventPill(e,false); }).join('')
        +(evs.length===0?'<div style="font-size:11px;color:var(--faint)">Sem projetos</div>':'')
        +'</div>';
    });
    html+='</div>';
    return html;
  }

  function calDia(events){
    var ds=state.calDate.length===7?state.calDate+'-01':state.calDate;
    var evs=calEventsOn(events,ds);
    if(!evs.length) return '<div class="empty" style="padding:40px;text-align:center"><div style="font-size:15px;color:var(--faint)">Nenhum projeto neste dia.</div></div>';
    return '<div style="display:flex;flex-direction:column;gap:10px">'
      +evs.map(function(e){
        return '<div style="background:var(--surface-2);border:1px solid var(--line);border-left:4px solid '+e.color+';border-radius:10px;padding:14px 18px;cursor:pointer" data-pid="'+e.projectId+'">'
          +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
          +'<span style="font-size:12px;font-weight:700;color:'+e.color+';background:'+e.color+'22;padding:2px 8px;border-radius:4px">'+esc(e.code)+'</span>'
          +'<span style="font-size:14px;font-weight:700">'+esc(e.client)+'</span>'
          +'<span style="font-size:12.5px;color:var(--dim)">'+esc(e.stageName)+'</span>'
          +'<span class="pill '+(e.status==='concluido'?'con':e.status==='andamento'?'and':'pau')+'" style="font-size:10.5px">'+esc(e.status)+'</span>'
          +'</div>'
          +(e.profs.length?'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'
            +e.profs.map(function(n){ return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2px 10px"><span class="avatar" style="width:18px;height:18px;font-size:8px">'+initials(n)+'</span>'+esc(n.split(' ')[0])+'</span>'; }).join('')
            +'</div>':'')
          +'</div>';
      }).join('')+'</div>';
  }

  shell('<div class="phead"><div><h1>Meus Projetos</h1><div class="sub">CRM de acompanhamento — compartilhe o link com o cliente.</div></div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +viewToggle
    +(isAdmin()?'<button class="btn" id="crm-new">+ Novo projeto</button>':'')
    +'</div></div>'
    +(view_==='list'
      ? listViewHtml()
      : view_==='calendar'
      ? calendarViewHtml()
      : (sel ? renderCrmDetail(sel) : '<div class="empty"><div class="big">Selecione um projeto</div></div>')));

  // bind view toggle
  var vl=document.getElementById('crm-view-list'), vd=document.getElementById('crm-view-detail');
  if(vl) vl.onclick=function(){ state.crmView='list'; state.crmSelId=null; render(); };
  if(vd) vd.onclick=function(){ state.crmView='detail'; render(); };
  var vc=document.getElementById('crm-view-cal'); if(vc) vc.onclick=function(){ state.crmView='calendar'; render(); };

  // calendar nav
  if(state.crmView==='calendar'){
    var cp=document.getElementById('cal-prev');
    var cn=document.getElementById('cal-next');
    var ct=document.getElementById('cal-today');
    var cv=state.calView||'mes';
    function calShift(dir){
      var dt=state.calDate||(new Date().toISOString().slice(0,7));
      if(cv==='mes'){
        var yr=+dt.slice(0,4),mo=+dt.slice(5,7)-1+dir;
        if(mo<0){ mo=11; yr--; } if(mo>11){ mo=0; yr++; }
        state.calDate=yr+'-'+String(mo+1).padStart(2,'0');
      } else if(cv==='semana'){
        var d=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
        d.setDate(d.getDate()+dir*7);
        state.calDate=d.toISOString().slice(0,10);
      } else {
        var d2=new Date((dt.length===7?dt+'-01':dt)+'T12:00:00');
        d2.setDate(d2.getDate()+dir);
        state.calDate=d2.toISOString().slice(0,10);
      }
      render();
    }
    if(cp) cp.onclick=function(){ calShift(-1); };
    if(cn) cn.onclick=function(){ calShift(1); };
    if(ct) ct.onclick=function(){ state.calDate=new Date().toISOString().slice(0,7); render(); };
    [].forEach.call(view.querySelectorAll('[data-cv]'),function(b){
      b.onclick=function(){ state.calView=b.dataset.cv; render(); };
    });
    [].forEach.call(view.querySelectorAll('[data-pid]'),function(el){
      el.onclick=function(){ state.crmSelId=el.dataset.pid; state.crmView='detail'; state.crmTab='geral'; render(); };
    });
  }

  if(view_==='list'){
    [].forEach.call(view.querySelectorAll('.crm-list-open'),function(b){
      b.onclick=function(e){ e.stopPropagation(); state.crmSelId=b.dataset.id; state.crmView='detail'; state.crmTab='geral'; render(); };
    });
    [].forEach.call(view.querySelectorAll('.lrow[data-id]'),function(r){
      r.onclick=function(e){ if(e.target.closest('button')) return; state.crmSelId=r.dataset.id; state.crmView='detail'; state.crmTab='geral'; render(); };
    });
  } else {
    if(isAdmin()){ var nb=document.getElementById('crm-new'); if(nb) nb.onclick=function(){ modalCrmProject(null); }; }
    if(sel) bindCrmDetail(sel);
    // back button in detail view
    var backBtn=document.getElementById('crm-back-list');
    if(backBtn) backBtn.onclick=function(){ state.crmView='list'; state.crmSelId=null; render(); };
  }
}

function stagesHtml(p){
  return (p.stages||[]).map(function(st){
    var open=state.crmOpenStage===st.id;
    var tot=st.subtasks.length, done=st.subtasks.filter(function(x){ return x.done; }).length;
    var body='';
    if(open){
      body='<div class="stage-body">'
        +'<div class="stage-row-dates"><div class="field"><label>Inicio</label><input class="inp crm-start" type="date" value="'+(st.start||'')+'" data-st="'+st.id+'"'+(isAdmin()?'':' disabled')+'></div>'
        +'<div class="field"><label>Fim</label><input class="inp crm-end" type="date" value="'+(st.end||'')+'" data-st="'+st.id+'"'+(isAdmin()?'':' disabled')+'></div></div>'
        +'<div class="sub-list"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 0 6px">Subtarefas — '+done+' de '+tot+'</div>'
        +st.subtasks.map(function(sub,sbi){
          return '<div class="sub-item" data-st="'+st.id+'" data-sbi="'+sbi+'">'
            +'<button class="sub-check'+(sub.done?' checked':'')+' crm-sub" data-st="'+st.id+'" data-sbi="'+sbi+'"></button>'
            +'<span class="sub-label'+(sub.done?' done':'')+'">'+sub.name+'</span>'
            +(isAdmin()?'<button class="xdel crm-sub-del" data-st="'+st.id+'" data-sbi="'+sbi+'" title="Remover">x</button>':'')
            +'</div>';
        }).join('')
        +(isAdmin()?'<div class="sub-add"><input class="inp crm-sub-inp" placeholder="Nova subtarefa..." data-st="'+st.id+'"><button class="btn ghost sm crm-sub-add" data-st="'+st.id+'">Adicionar</button></div>':'')
        +'</div>'
        +(isAdmin()?'<div class="stage-actions"><button class="btn ghost sm crm-copy-rev" data-st="'+st.id+'">Copiar como revisao</button><button class="btn ghost sm crm-stg-del" data-st="'+st.id+'">Remover etapa</button></div>':'')
        +'</div>';
    }
    var subTot=st.subtasks.length, subDone=st.subtasks.filter(function(x){ return x.done; }).length;
    var subBlocking=subTot>0&&subDone<subTot&&st.status!=='concluido';
    return '<div class="stage-block" data-si="'+st.id+'">'
      +'<div class="stage-head crm-stage-hd" data-st="'+st.id+'">'
      +'<span class="stage-code">'+esc(st.code)+'</span>'
      +'<span class="stage-name">'+esc(st.name)+'</span>'
      +'<span class="stage-dates">'+(st.start?fmtDate(st.start)+(st.end?' -> '+fmtDate(st.end):''):'--')+'</span>'
      +(subTot>0?'<span style="font-size:11.5px;color:'+(subBlocking?'var(--alerta)':'var(--verde)')+';font-weight:600;white-space:nowrap">'+subDone+'/'+subTot+' subtarefas</span>':'')
      +'<button class="st-pill '+CRM_PILL[st.status||'pendente']+' crm-cycle" data-st="'+st.id+'"'+(subBlocking&&st.status!=='concluido'?' title="Conclua as subtarefas antes de finalizar"':'')+'>'+(CRM_STATUS_LABEL[st.status||'pendente'])+'</button>'
      +'<span class="stage-toggle">'+(open?'a':'v')+'</span>'
      +'</div>'+body+'</div>';
  }).join('')||'<div class="free">Nenhuma etapa.</div>';
}

// ── FINANCEIRO ────────────────────────────────────────────────────────────────
function parcValue(c,p){ return Math.round(c.value*(p.pct||0))/100; }
function contractPaid(c){ return c.installments.filter(function(p){ return p.status==='pago'; }).reduce(function(s,p){ return s+parcValue(c,p); },0); }
function contractPending(c){ return Math.max(0,(c.value||0)-contractPaid(c)); }
function occLate(due,paid){ return !paid&&due&&due<today(); }
function itemOccursIn(it,mk){ return it.recurring?(it.startMonth||'0000-00')<=mk:(it.date||'').slice(0,7)===mk; }
function itemDue(it,mk){ return it.recurring?dueInMonth(mk,it.day||1):it.date; }
function itemPaid(it,mk){ return it.recurring?(it.paidMonths||[]).indexOf(mk)>=0:!!it.paid; }
function toggleItemPaid(it,mk){ if(it.recurring){ it.paidMonths=it.paidMonths||[]; var i=it.paidMonths.indexOf(mk); if(i>=0) it.paidMonths.splice(i,1); else it.paidMonths.push(mk); } else it.paid=!it.paid; save(); render(); }
function collectMonth(mk){
  var entradas=[],saidas=[];
  db.finance.contracts.forEach(function(c){ c.installments.forEach(function(p,i){ if((p.due||'').slice(0,7)===mk) entradas.push({kind:'parcela',c:c,p:p,idx:i,desc:c.client,sub:'Parcela '+(i+1)+' de '+c.installments.length+' · '+(p.pct||0)+'%',value:parcValue(c,p),due:p.due,paid:p.status==='pago'}); }); });
  db.finance.incomes.forEach(function(it){ if(itemOccursIn(it,mk)) entradas.push({kind:'income',it:it,desc:it.client?it.client:it.type,sub:(it.client?it.type+' · ':'')+( it.recurring?'Recorrente':'Avulso'),value:it.value,due:itemDue(it,mk),paid:itemPaid(it,mk)}); });
  entradas.sort(function(a,b){ return (a.due||'').localeCompare(b.due||''); });
  db.finance.expenses.forEach(function(it){ if(itemOccursIn(it,mk)) saidas.push({kind:'expense',it:it,desc:it.desc,sub:it.recurring?'Custo fixo · recorrente':'Avulso',value:it.value,due:itemDue(it,mk),paid:itemPaid(it,mk)}); });
  saidas.sort(function(a,b){ return (a.due||'').localeCompare(b.due||''); });
  return {entradas:entradas,saidas:saidas};
}

function pageFinanceiro(){
  if(!isAdmin()){ state.page='projetos'; return pageProjetos(); }
  var mk=state.finMonth, F=db.finance;
  var cm=collectMonth(mk), entradas=cm.entradas, saidas=cm.saidas;
  var entPrev=entradas.reduce(function(s,e){ return s+e.value; },0);
  var entRec=entradas.filter(function(e){ return e.paid; }).reduce(function(s,e){ return s+e.value; },0);
  var saiPrev=saidas.reduce(function(s,e){ return s+e.value; },0);
  var saiPago=saidas.filter(function(e){ return e.paid; }).reduce(function(s,e){ return s+e.value; },0);
  var saldo=entRec-saiPago;
  var aRec=F.contracts.reduce(function(s,c){ return s+contractPending(c); },0);
  var reserveBal=(F.reserve.movements||[]).reduce(function(s,m){ return s+(m.type==='aporte'?m.value:-m.value); },0);
  var fixos=F.expenses.filter(function(e){ return e.recurring; }).reduce(function(s,e){ return s+e.value; },0);
  var cobr=fixos>0?reserveBal/fixos:null;
  var contracts=F.contracts.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });

  /* ── METRICAS DE NEGOCIO ───────────────────────────────────────────────── */
  // Ticket medio: media dos contratos com valor > 0
  var contractsComValor=F.contracts.filter(function(c){ return c.value>0; });
  var ticketMedio=contractsComValor.length?contractsComValor.reduce(function(s,c){ return s+c.value; },0)/contractsComValor.length:0;

  // Faturamento acumulado (total recebido em todos os contratos)
  var fatTotal=F.contracts.reduce(function(s,c){ return s+contractPaid(c); },0);

  // Projetos ativos
  var projAtivos=db.projects.length;
  var projCrmAtivos=db.crmProjects.filter(function(p){ return p.stages&&p.stages.some(function(s){ return s.status==='andamento'; }); }).length;

  // Inadimplencia: parcelas vencidas e nao pagas
  var inadimpl=[];
  F.contracts.forEach(function(c){
    c.installments.forEach(function(p,i){
      if(occLate(p.due,p.status==='pago')) inadimpl.push({c:c,p:p,i:i,dias:Math.floor((Date.now()-new Date(p.due).getTime())/864e5)});
    });
  });
  var inadimplVal=inadimpl.reduce(function(s,x){ return s+parcValue(x.c,x.p); },0);

  // Pipeline de receita: a receber nos proximos 3 meses por mes
  var pipeline=[];
  for(var mi=0;mi<3;mi++){
    var pmk=shiftMonth(mk,mi);
    var pv=0;
    F.contracts.forEach(function(c){ c.installments.forEach(function(p){ if((p.due||'').slice(0,7)===pmk&&p.status!=='pago') pv+=parcValue(c,p); }); });
    pipeline.push({mk:pmk,v:pv});
  }
  var pipelineMax=Math.max(1,pipeline.reduce(function(m,x){ return Math.max(m,x.v); },0));

  // Margem operacional estimada (entradas recebidas - saidas pagas, acumulado 12m)
  var acc12=[];
  for(var ai=11;ai>=0;ai--){
    var amk=shiftMonth(mk,-ai);
    var cm12=collectMonth(amk);
    var er=cm12.entradas.filter(function(e){ return e.paid; }).reduce(function(s,e){ return s+e.value; },0);
    var sp=cm12.saidas.filter(function(e){ return e.paid; }).reduce(function(s,e){ return s+e.value; },0);
    acc12.push({mk:amk,er:er,sp:sp,s:er-sp});
  }
  var fat12=acc12.reduce(function(s,x){ return s+x.er; },0);
  var gasto12=acc12.reduce(function(s,x){ return s+x.sp; },0);
  var margem12=fat12>0?Math.round((fat12-gasto12)/fat12*100):0;

  // Leads em pipeline (em negociacao, reuniao, proposta)
  var leadsQuentes=db.leads.filter(function(l){ return ['negociacao','reuniao','proposta'].indexOf(l.status)>=0; }).length;
  var valPipeline=db.leads.filter(function(l){ return ['negociacao','reuniao','proposta','fechado'].indexOf(l.status)>=0&&l.value>0; }).reduce(function(s,l){ return s+l.value; },0);

  function rowHtml(e,i,tipo){
    var late=occLate(e.due,e.paid);
    return '<div class="frow"><div class="fd"><div class="t">'+esc(e.desc)+'</div><div class="c">'+esc(e.sub)+'</div></div>'
      +'<span class="fdue'+(late?' late':'')+'">'+( late?'⚠ ':'')+( e.due?fmtDate(e.due):'—')+'</span>'
      +'<span class="fv">'+fmtMoney(e.value)+'</span>'
      +'<button class="pstat '+(e.paid?'pago':(late?'atras':'pend'))+'" data-tipo="'+tipo+'" data-i="'+i+'">'+(e.paid?'Pago':(late?'Atrasado':'Pendente'))+'</button></div>';
  }

  var cCards=contracts.map(function(c){
    var paid=contractPaid(c),pend=contractPending(c),np=c.installments.length,npg=c.installments.filter(function(p){ return p.status==='pago'; }).length;
    var late=c.installments.some(function(p){ return occLate(p.due,p.status==='pago'); });
    var pct=c.value?Math.round(paid/c.value*100):0;
    return '<div class="ccard" data-id="'+c.id+'">'
      +'<h3>'+esc(c.client)+'</h3><div class="cm">'+(c.condition?esc(c.condition):'Condicao nao definida')+'</div>'
      +'<div class="cv">'+fmtMoney(c.value)+'</div>'
      +'<div class="traco"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cm">'+npg+' de '+(np||'—')+' parcelas · recebido '+fmtMoney(paid)+' · a receber <b>'+fmtMoney(pend)+'</b></div>'
      +(late?'<div class="late-flag">Parcela em atraso</div>':'')
      +'</div>';
  }).join('');

  var reserveMoves=(F.reserve.movements||[]).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,8);

  shell('<div class="phead"><div><h1>Financeiro</h1><div class="sub">Visao completa — caixa, contratos, inadimplencia e saude do negocio.</div></div>'
    +'<div class="monthnav"><button class="mbtn" id="m-prev">◀</button><b style="min-width:150px;text-align:center">'+monthLabel(mk)+'</b><button class="mbtn" id="m-next">▶</button></div></div>'

    // KPIs do mes
    +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 8px">Mes atual — '+monthLabel(mk)+'</div>'
    +'<div class="kpis">'
    +'<div class="kpi"><div class="v">'+fmtMoney(entPrev)+'</div><div class="l">Entradas previstas</div></div>'
    +'<div class="kpi good"><div class="v">'+fmtMoney(entRec)+'</div><div class="l">Recebido</div></div>'
    +'<div class="kpi"><div class="v">'+fmtMoney(saiPrev)+'</div><div class="l">Saidas previstas</div></div>'
    +'<div class="kpi bad"><div class="v">'+fmtMoney(saiPago)+'</div><div class="l">Pago</div></div>'
    +'<div class="kpi '+(saldo>=0?'good':'bad')+'"><div class="v">'+fmtMoney(saldo)+'</div><div class="l">Saldo do mes</div></div>'
    +'<div class="kpi hl"><div class="v">'+fmtMoney(aRec)+'</div><div class="l">A receber (contratos)</div></div>'
    +'<div class="kpi"><div class="v">'+fmtMoney(reserveBal)+'</div><div class="l">Reserva de caixa</div></div>'
    +'</div>'

    // KPIs de negocio
    +'<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:20px 0 8px">Saude do negocio — ultimos 12 meses</div>'
    +'<div class="kpis">'
    +'<div class="kpi hl"><div class="v">'+fmtMoney(fat12)+'</div><div class="l">Faturado (12m)</div></div>'
    +'<div class="kpi hl"><div class="v">'+fmtMoney(ticketMedio)+'</div><div class="l">Ticket medio</div></div>'
    +'<div class="kpi '+(margem12>=30?'good':margem12>=10?'':'bad')+'"><div class="v">'+margem12+'%</div><div class="l">Margem operacional</div></div>'
    +'<div class="kpi"><div class="v">'+projAtivos+'</div><div class="l">Projetos em andamento</div></div>'
    +'<div class="kpi"><div class="v">'+leadsQuentes+'</div><div class="l">Leads em negociacao</div></div>'
    +'<div class="kpi"><div class="v">'+fmtMoney(valPipeline)+'</div><div class="l">Pipeline de vendas</div></div>'
    +'<div class="kpi '+(inadimpl.length?'bad':'good')+'"><div class="v">'+fmtMoney(inadimplVal)+'</div><div class="l">Inadimplencia</div></div>'
    +'</div>'

    // Alerta de inadimplencia
    +(inadimpl.length?'<div class="alertbox" style="margin-bottom:16px"><div class="at">'+inadimpl.length+' parcela'+(inadimpl.length===1?' vencida':' vencidas')+' sem pagamento — '+fmtMoney(inadimplVal)+' em risco</div><ul>'
      +inadimpl.slice(0,6).map(function(x){ return '<li><b>'+esc(x.c.client)+'</b> — Parcela '+(x.i+1)+' · '+fmtMoney(parcValue(x.c,x.p))+' · venceu '+fmtDate(x.p.due)+' ('+x.dias+' dias)</li>'; }).join('')
      +(inadimpl.length>6?'<li style="color:var(--faint)">...e mais '+(inadimpl.length-6)+'</li>':'')
      +'</ul></div>':'')

    // Pipeline de receita proximos 3 meses
    +'<div class="panel" style="margin-bottom:14px"><h3>Pipeline de receita — proximos 3 meses</h3><div class="hint">Parcelas a receber em aberto, por mes.</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px">'
    +pipeline.map(function(pm,i){
      var w=pipelineMax>0?Math.round(pm.v/pipelineMax*100):0;
      return '<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px">'
        +'<div style="font-size:11.5px;color:var(--faint);margin-bottom:4px">'+monthLabel(pm.mk)+'</div>'
        +'<div style="font-size:20px;font-weight:700;color:'+(pm.v>0?'var(--madeira)':'var(--faint)')+'">'+fmtMoney(pm.v)+'</div>'
        +'<div class="traco" style="margin:8px 0 4px"><i style="width:'+w+'%;background:var(--madeira)"></i></div>'
        +'</div>';
    }).join('')
    +'</div></div>'

    +'<div class="two-col" style="margin-top:4px">'
    +'<div class="panel"><h3>Reserva de caixa</h3><div class="hint">Colchao de seguranca do escritorio.</div>'
    +'<div class="cv" style="font-size:24px;font-weight:700;margin:4px 0 2px">'+fmtMoney(reserveBal)+'</div>'
    +(F.reserve.goal>0?'<div class="cm">Meta: '+fmtMoney(F.reserve.goal)+' · '+Math.min(100,Math.round(reserveBal/F.reserve.goal*100))+'% alcancado</div>'+'<div class="traco" style="margin:10px 0"><i style="width:'+Math.min(100,Math.round(reserveBal/F.reserve.goal*100))+'%"></i></div>':'')
    +(cobr!==null?'<div class="cm" style="font-size:12.5px;color:var(--ink-2);margin-top:6px">Cobre <b>'+cobr.toFixed(1).replace('.',',')+'</b> mes(es) de custos fixos</div>':'')
    +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" id="rv-in">+ Aporte</button><button class="btn ghost sm" id="rv-out">− Retirada</button><button class="btn ghost sm" id="rv-goal">Definir meta</button></div>'
    +'</div>'
    +'<div class="panel" style="padding:0"><div class="phead" style="margin:0;padding:16px 16px 4px"><div><h1 style="font-size:15px">Movimentacoes da reserva</h1></div></div>'
    +(reserveMoves.length?reserveMoves.map(function(m){ return '<div class="frow"><div class="fd"><div class="t">'+(m.type==='aporte'?'Aporte':'Retirada')+(m.note?' — '+esc(m.note):'')+'</div><div class="c">'+(m.date?fmtDate(m.date):'')+'</div></div><span class="fv" style="color:'+(m.type==='aporte'?'var(--verde)':'var(--alerta)')+'">'+( m.type==='aporte'?'+':'−')+' '+fmtMoney(m.value)+'</span><button class="xdel rv-del" data-id="'+m.id+'">x</button></div>'; }).join(''):'<div class="free" style="padding:14px 16px">Nenhuma movimentacao.</div>')
    +'</div></div>'
    +'<div class="phead" style="margin:24px 0 12px"><div><h1 style="font-size:16px">Contratos</h1></div><button class="btn ghost sm" id="btn-contract">+ Contrato</button></div>'
    +(contracts.length?'<div class="grid">'+cCards+'</div>':'<div class="empty">Nenhum contrato. Feche um lead ou crie manualmente.</div>')
    +'<div class="two-col" style="margin-top:24px">'
    +'<div class="panel" style="padding:0"><div class="phead" style="margin:0;padding:16px 16px 4px"><div><h1 style="font-size:15px">Entradas</h1></div><button class="btn ghost sm" id="btn-income">+ Receita</button></div>'
    +(entradas.length?entradas.map(function(e,i){ return rowHtml(e,i,'ent'); }).join(''):'<div class="free" style="padding:14px">Nenhuma entrada.</div>')
    +'<div class="ftot"><span>Previsto: <b>'+fmtMoney(entPrev)+'</b></span><span>Recebido: <b style="color:var(--verde)">'+fmtMoney(entRec)+'</b></span></div></div>'
    +'<div class="panel" style="padding:0"><div class="phead" style="margin:0;padding:16px 16px 4px"><div><h1 style="font-size:15px">Saidas</h1></div><button class="btn ghost sm" id="btn-expense">+ Despesa</button></div>'
    +(saidas.length?saidas.map(function(e,i){ return rowHtml(e,i,'sai'); }).join(''):'<div class="free" style="padding:14px">Nenhuma saida.</div>')
    +'<div class="ftot"><span>Previsto: <b>'+fmtMoney(saiPrev)+'</b></span><span>Pago: <b style="color:var(--alerta)">'+fmtMoney(saiPago)+'</b></span></div></div>'
    +'</div>');

  document.getElementById('m-prev').onclick=function(){ state.finMonth=shiftMonth(mk,-1); render(); };
  document.getElementById('m-next').onclick=function(){ state.finMonth=shiftMonth(mk,1); render(); };
  document.getElementById('btn-contract').onclick=function(){ modalContract(null); };
  document.getElementById('btn-income').onclick=function(){ modalFinItem('income',null); };
  document.getElementById('btn-expense').onclick=function(){ modalFinItem('expense',null); };
  document.getElementById('rv-in').onclick=function(){ modalReserve('aporte'); };
  document.getElementById('rv-out').onclick=function(){ modalReserve('retirada'); };
  document.getElementById('rv-goal').onclick=function(){
    var v=prompt('Meta da reserva (R$):',F.reserve.goal?String(F.reserve.goal).replace('.',','):'');
    if(v===null) return; F.reserve.goal=parseMoney(v); save(); render();
  };
  [].forEach.call(view.querySelectorAll('.rv-del'),function(b){ b.onclick=function(){ if(confirm('Excluir movimentacao?')){ F.reserve.movements=F.reserve.movements.filter(function(m){ return m.id!==b.dataset.id; }); save(); render(); } }; });
  [].forEach.call(view.querySelectorAll('.ccard'),function(c){ c.onclick=function(){ modalContract(c.dataset.id); }; });
  [].forEach.call(view.querySelectorAll('.pstat[data-tipo]'),function(b){
    b.onclick=function(e){ e.stopPropagation();
      var arr=b.dataset.tipo==='ent'?entradas:saidas, it=arr[+b.dataset.i];
      if(it.kind==='parcela'){ it.p.status=it.p.status==='pago'?'pendente':'pago'; it.p.paidAt=it.p.status==='pago'?Date.now():null; save(); render(); }
      else toggleItemPaid(it.it,mk);
    };
  });
}

function modalReserve(type){
  var isIn=type==='aporte';
  var bal=(db.finance.reserve.movements||[]).reduce(function(s,m){ return s+(m.type==='aporte'?m.value:-m.value); },0);
  var ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<div class="modal"><h2>'+(isIn?'Aporte na reserva':'Retirada da reserva')+'</h2><div class="msub">Saldo atual: <b>'+fmtMoney(bal)+'</b></div>'
    +'<div class="field-row"><div class="field"><label>Valor (R$)</label><input class="inp" id="rv-value" placeholder="Ex.: 2.000,00"></div><div class="field"><label>Data</label><input class="inp" id="rv-date" type="date" value="'+today()+'"></div></div>'
    +'<div class="field"><label>Observacao</label><input class="inp" id="rv-note" placeholder="'+(isIn?'Ex.: sobra do mes…':'Ex.: cobrir imprevisto…')+'"></div>'
    +'<div class="field-err" id="rv-err" style="display:none"></div>'
    +'<div class="modal-actions"><button class="btn ghost" id="rv-cancel">Cancelar</button><button class="btn" id="rv-ok">'+(isIn?'Registrar aporte':'Registrar retirada')+'</button></div></div>';
  document.getElementById('app-root').appendChild(ov);
  ov.querySelector('#rv-cancel').onclick=function(){ ov.remove(); };
  ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  ov.querySelector('#rv-value').focus();
  ov.querySelector('#rv-ok').onclick=function(){
    var err=ov.querySelector('#rv-err'), val=parseMoney(ov.querySelector('#rv-value').value);
    if(val<=0){ err.textContent='Informe o valor.'; err.style.display='block'; return; }
    if(!isIn&&val>bal&&!confirm('Esta retirada deixa a reserva negativa. Continuar?')) return;
    db.finance.reserve.movements.push({id:uid(),type:type,value:val,date:ov.querySelector('#rv-date').value||today(),note:ov.querySelector('#rv-note').value.trim()});
    save(); ov.remove(); render();
  };
}

function modalContract(cid){
  var isNew=!cid;
  var c=isNew?{id:uid(),client:'',value:0,condition:'',installments:[],createdAt:Date.now()}:db.finance.contracts.find(function(x){ return x.id===cid; });
  if(!c) return;
  var ov=document.createElement('div'); ov.className='overlay';
  function draw(){
    var totPct=c.installments.reduce(function(s,p){ return s+(+p.pct||0); },0);
    var totVal=c.installments.reduce(function(s,p){ return s+parcValue(c,p); },0);
    ov.innerHTML='<div class="modal wide"><h2>'+(isNew?'Novo contrato':'Contrato — '+esc(c.client))+'</h2>'
      +'<div class="field-row"><div class="field"><label>Cliente</label><input class="inp" id="ct-client" value="'+esc(c.client)+'"></div>'
      +'<div class="field"><label>Valor total (R$)</label><input class="inp" id="ct-value" value="'+(c.value?fmtMoney(c.value).replace('R$','').trim():'')+'" placeholder="45.000,00"></div></div>'
      +'<div class="field"><label>Condicao de pagamento</label><input class="inp" id="ct-cond" value="'+esc(c.condition||'')+'" placeholder="Ex.: 30% de entrada + 5 parcelas mensais"></div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:14px">'
      +'<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700">Parcelas</div>'
      +'<div style="display:flex;gap:8px;align-items:center"><input class="inp" id="ct-nparc" type="number" min="1" max="36" placeholder="No" style="width:64px"><button class="btn ghost sm" id="ct-gen">Gerar</button><button class="btn ghost sm" id="ct-addp">+ 1</button></div></div>'
      +(c.installments.length?
        '<div class="parc-head"><span>#</span><span>%</span><span>R$</span><span>Total</span><span>Vencimento</span><span>Status</span><span>Boleto (link)</span><span></span><span></span></div>'
        +c.installments.map(function(p,i){
          var late=occLate(p.due,p.status==='pago');
          return '<div class="parc-row" data-i="'+i+'">'
            +'<span class="pn">'+(i+1)+'a</span>'
            +'<input class="inp p-pct" type="number" min="0" max="100" step="0.01" value="'+(p.pct||0)+'" title="%">'
            +'<input class="inp p-val" type="text" value="'+(parcValue(c,p)?fmtMoney(parcValue(c,p)).replace('R$','').trim():'')+'" placeholder="R$" title="Valor em reais" style="max-width:110px">'
            +'<span class="pv">'+fmtMoney(parcValue(c,p))+'</span>'
            +'<input class="inp p-due" type="date" value="'+(p.due||'')+'">'
            +'<button class="pstat '+(p.status==='pago'?'pago':(late?'atras':'pend'))+' p-st">'+(p.status==='pago'?'Pago':(late?'Atrasado':'Pendente'))+'</button>'
            +'<input class="inp p-bol" placeholder="Cole o link do boleto…" value="'+esc(p.boleto||'')+'">'
            +'<button class="wabtn p-wa" title="Enviar boleto WhatsApp"><svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:var(--verde)"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.8.8 1.9.1.1.1.3 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.5.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1l1.9.9c.2.1.4.2.5.3 0 .1 0 .7-.2 1.2Z"/></svg></button>'
            +'<button class="xdel p-del">x</button>'
            +'</div>';
        }).join('')
        +'<div class="ftot"><span>Total: <b style="color:'+(Math.abs(totPct-100)<0.01?'var(--verde)':'var(--alerta)')+'">'+totPct.toFixed(1).replace('.',',')+'%</b></span><span><b>'+fmtMoney(totVal)+'</b></span></div>'
        :'<div class="free">Nenhuma parcela — informe o numero e clique em "Gerar".</div>')
      +'<div class="modal-actions">'
      +(!isNew?'<button class="btn danger left" id="ct-del">Excluir</button>':'')
      +'<button class="btn ghost" id="ct-close">Fechar</button><button class="btn" id="ct-save">'+(isNew?'Criar':'Salvar')+'</button></div></div>';
    bind();
  }
  function readHead(){ c.client=ov.querySelector('#ct-client').value.trim(); c.value=parseMoney(ov.querySelector('#ct-value').value); c.condition=ov.querySelector('#ct-cond').value.trim(); }
  function bind(){
    ov.onclick=function(e){ if(e.target===ov){ if(!isNew) readHead(); ov.remove(); render(); } };
    ov.querySelector('#ct-close').onclick=function(){ if(!isNew) readHead(); ov.remove(); render(); };

function sendBoletoWhatsApp(c,p,idx){
  var lead=c.leadId?db.leads.find(function(l){ return l.id===c.leadId; }):null;
  var phone=((lead&&lead.contact)||'').replace(/\D/g,'');
  if(!phone){ alert('Sem WhatsApp no lead deste contrato.'); return; }
  var full=phone.startsWith('55')&&phone.length>=12?phone:'55'+phone;
  var msg=(db.waBoletoTemplate||'').split('{nome}').join(firstName(c.client)).split('{parcela}').join((idx+1)+'a').split('{valor}').join(fmtMoney(parcValue(c,p))).split('{vencimento}').join(p.due?fmtDate(p.due):'a definir').split('{link}').join(p.boleto||'').replace(/\s{2,}/g,' ').trim();
  window.open('https://wa.me/'+full+'?text='+encodeURIComponent(msg),'_blank');
}

function modalFinItem(kind,id){
  var isInc=kind==='income', arr=isInc?db.finance.incomes:db.finance.expenses;

  var it=isNew?(isInc?
    {id:uid(),type:INCOME_TYPES[0],client:'',value:0,recurring:false,day:5,date:today(),startMonth:state.finMonth,paidMonths:[],paid:false}:

  function draw(){
    var isReserva=!isInc && (ov.querySelector('#fi-cat')?ov.querySelector('#fi-cat').value==='Reserva de caixa':it.desc==='Reserva de caixa');

        :'<div class="field"><label>Categoria</label><select class="inp" id="fi-cat"><option value="">Selecione...</option>'+catOpts+'</select></div>'
         +'<div class="field"><label>Descricao</label><input class="inp" id="fi-desc" value="'+esc(it.desc||'')+'" placeholder="Ex.: Aluguel sala comercial"></div>'
      )
      +(isReserva?'<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13px"><b>Saldo atual da reserva: '+fmtMoney(reserveBal)+'</b><br><span style="color:var(--faint);font-size:12px">O valor sera preenchido automaticamente com o saldo da reserva. Voce pode alterar se necessario.</span></div>':'')
      +'<div class="field-row"><div class="field"><label>Valor (R$)</label><input class="inp" id="fi-value" value="'+(isReserva&&!it.value?fmtMoney(reserveBal).replace('R$','').trim():(it.value?fmtMoney(it.value).replace('R$','').trim():''))+'" placeholder="1.200,00"></div>'
      +'<div class="field"><label>Recorrencia</label><select class="inp" id="fi-rec"><option value="no"'+(!it.recurring?' selected':'')+'>Avulso</option><option value="yes"'+(it.recurring?' selected':'')+'>Recorrente</option></select></div></div>'
      +'<div class="field-row"><div class="field" id="fi-date-wrap" style="display:'+(it.recurring?'none':'block')+'"><label>Data</label><input class="inp" id="fi-date" type="date" value="'+(it.date||today())+'"></div>'
      +'<div class="field" id="fi-day-wrap" style="display:'+(it.recurring?'block':'none')+'"><label>Dia do vencimento</label><input class="inp" id="fi-day" type="number" min="1" max="31" value="'+(it.day||5)+'"></div></div>'
      +'<div class="field-err" id="fi-err" style="display:none"></div>'
